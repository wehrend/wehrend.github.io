    <defs>
        <marker id="arrow" markerWidth="4" markerHeight="3" refX="1.5" refY="0" orient="0" markerUnits="strokeWidth">
            <polygon points="0 0, 1.5 4, 3 0" fill="black" />
        </marker>
    </defs>

    <symbol id="resistor_v">
        <line x1="45" y1="33" x2="45" y2="50" style="stroke:black;"/>
        <line x1="45" y1="65" x2="45" y2="80" style="stroke:black;"/>
