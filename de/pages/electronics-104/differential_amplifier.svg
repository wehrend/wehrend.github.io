<svg width="120" height="100" viewBox="0 0 100 100"
     xmlns="http://www.w3.org/2000/svg">

    <!-- Marker außerhalb des Symbols (robuster) -->
    <defs>
        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3"
                orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L6,3 z" fill="black"/>
        </marker>
    </defs>

    <symbol id="npn">
        <g transform="translate(0 15.5)">
            <g id="npn_classic">
                <polyline points="73,20 80,15 80,05" style="stroke:black;stroke-width:1;fill:none;"/>
                <!-- Basis -->
                <line x1="58" y1="25" x2="73" y2="25"
                      style="stroke:black;stroke-width:1;fill:none;stroke-linecap:round"/>
                <line x1="73" y1="18" x2="73" y2="31" style="stroke:black;stroke-width:1;fill:none;"/>
                <!-- Emitter -->
                <polyline points="73,28 80,35 80,42" style="stroke:black;stroke-width:1;fill:none;"/>
                <!-- Pfeil -->
                <line x1="77" y1="34" x2="80" y2="37" style="stroke:black;stroke-width:1;marker-end:url(#arrowhead)"/>
                <!-- Kreis -->
                <circle cx="76" cy="25" r="11" style="stroke:black;stroke-width:1;fill:none;"/>
            </g>
        </g>
    </symbol>

    <!-- IEC (EU) Rechteck -->
    <symbol id="resistor" viewBox="0 0 200 60">
        <!-- Leitungen -->
        <line x1="15" y1="30" x2="60" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <line x1="120" y1="30" x2="140" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- Widerstandskörper -->
        <rect x="60" y="20" width="60" height="20" fill="none" stroke="currentColor" stroke-width="4"/>
    </symbol>

    <!-- power line-->
    <line x1="52" y1="0" x2="52" y2="6" stroke="currentColor" stroke-width="0.7"/>
    <circle cx="52" cy="6" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="52" cy="1" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <line x1="31.5" y1="6" x2="75.5" y2="6" stroke="currentColor" stroke-width="0.7"/>
    <use href="#npn" transform="translate(-48, 12) "/>
    <g transform="translate(40,13) rotate(90)">
        <use href="#resistor" transform="translate(-10,-17) scale(0.5,0.5)"/>
    </g>

    <circle cx="32" cy="39" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <line x1="31" y1="39" x2="42" y2="39" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="42" cy="39" r="1" style="stroke:black;stroke-width:1;fill: black;"/>

    <use href="#npn" transform="translate(155,12) scale(-1,1)"/>
    <g transform="translate(40,13) rotate(90)">
        <use href="#resistor" transform="translate(-10,-60) scale(0.5,0.5)"/>
    </g>

    <circle cx="75" cy="39" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <line x1="65" y1="39" x2="75" y2="39" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="65" cy="39" r="1" style="stroke:black;stroke-width:1;fill: black;"/>

    <line x1="31.5" y1="69" x2="75.5" y2="69" stroke="currentColor" stroke-width="0.7"/>

    <g transform="translate(60,75) rotate(90)">
        <use href="#resistor" transform="translate(-12,-17) scale(0.5,0.5)"/>
    </g>
    <circle cx="52" cy="69" r="1" style="stroke:black;stroke-width:1;fill: black;"/>

    <circle cx="10" cy="52.5" r="1" style="stroke:black;stroke-width:1;fill:black;"/>
    <circle cx="98" cy="52.5" r="1" style="stroke:black;stroke-width:1;fill:black;"/>
    <circle cx="52" cy="99" r="1" style="stroke:black;stroke-width:1;fill:black;"/>
    <text x="42" y="55" font-size="4" style="stroke:red;stroke-width:0.1 " >
        <tspan>T</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">1</tspan>
    </text>
    <text x="63" y="55" font-size="4" style="stroke:red;stroke-width:0.1 " >
        <tspan>T</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">2</tspan>
    </text>

    <text x="12" y="50" font-size="4" style="stroke:red;stroke-width:0.1 " >
        <tspan>E</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">1</tspan>
    </text>
    <text x="93" y="50" font-size="4" style="stroke:red;stroke-width:0.1 " >
        <tspan>E</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">2</tspan>
    </text>

    <text x="42" y="35" font-size="4" style="stroke:red;stroke-width:0.1 " >
        <tspan>A</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">1</tspan>
    </text>
    <text x="63" y="35" font-size="4" style="stroke:red;stroke-width:0.1 " >
        <tspan>A</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">2</tspan>
    </text>

    <text x="42" y="25" font-size="4" style="stroke:red;stroke-width:0.1 " >
        <tspan>R</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">1</tspan>
    </text>
    <text x="63" y="25" font-size="4" style="stroke:red;stroke-width:0.1 " >
        <tspan>R</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">2</tspan>
    </text>
    <text x="63" y="85" font-size="4" style="stroke:red;stroke-width:0.1 " >
        <tspan>R</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">E</tspan>
    </text>

    <text x="55" y="5" fill="red" font-size="6">+</text>
    <text x="55" y="99" fill="red" font-size="6">-</text>
    <text x="15" y="85" font-size="6">Differential</text>
    <text x="15" y="92" font-size="6">Amplifier</text>
</svg>
