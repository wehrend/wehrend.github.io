<svg width="100.00" height="65.00"
     viewBox="0.0 0.0 100.0 65.0"
     viewPort="0 0 100px 65px"
     version="1.1"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns="http://www.w3.org/2000/svg">
    <symbol id="op-amp-full-pinout">
        <polygon points="15,5  15,25  35,15 " style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="10" y1="10" x2="15" y2="10" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="10" y1="21" x2="15" y2="21" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="35" y1="15" x2="45" y2="15" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <text x="16" y="12" font-size="5">-</text>
        <text x="17" y="22" font-size="5">+</text>
        <line x1="25" y1="5" x2="25" y2="10" style="stroke:black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
        <line x1="25" y1="20" x2="25" y2="25" style="stroke:black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
        <line x1="30" y1="8" x2="30" y2="12" style="stroke:black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
        <line x1="30" y1="17.5" x2="30" y2="23"
              style="stroke:black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
    </symbol>
        <!-- potentiometer built from the resistor style -->
    <symbol id="potentiometer_v" viewBox="0 0 160 200">
        <!-- leads and body replicate resistor_v (centered at x=80) -->
        <line x1="80" y1="15" x2="80" y2="60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <line x1="80" y1="120" x2="80" y2="140" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <rect x="70" y="60" width="20" height="60" fill="none" stroke="currentColor" stroke-width="4"/>
        <!-- wiper (terminal 2) going to the right -->
        <line x1="80" y1="90" x2="130" y2="90" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- little triangular pointer touching the track -->
        <polygon points="92,82 80,90 92,98" fill="currentColor"/>
        <!-- external pad for the wiper -->
        <!--      <line x1="130" y1="90" x2="150" y2="90" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>-->
    </symbol>
     <!-- IEC (EU) Rechteck -->
    <symbol id="resistor" viewBox="0 0 200 60">
        <!-- Leitungen -->
        <line x1="15" y1="30" x2="60" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <line x1="120" y1="30" x2="140" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- Widerstandskörper -->
        <rect x="60" y="20" width="60" height="20" fill="none" stroke="currentColor" stroke-width="4"/>
    </symbol>
    <!-- amperemeter (LA1) -->
    <symbol id="ampere" viewBox="0 0 200 100">
        <circle cx="100" cy="52.5" r="11.25" fill="none" stroke="red" stroke-width="1.5"/>
        <text x="95" y="55" font-size="14" fill="red">A</text>
    </symbol>
    <!--ground-->
    <symbol id="gnd">
        <line x1="40" y1="18" x2="40" y2="22" style="stroke:black;stroke-width:1;"/>
        <polygon points="36,22 44,22 40,27" style="stroke:black;stroke-width:1;fill:none;"/>
    </symbol>

    <use href="#resistor" transform="translate(2,-2) scale(0.35,0.35)"/>
    <use href="#resistor" transform="translate(20,-2) scale(0.35,0.35)"/>
    <line x1="15" y1="18" x2="20" y2="20" style="stroke:black;stroke-width:0.6px;fill:none;"/>

    <line x1="15" y1="33" x2="20" y2="31" style="stroke:black;stroke-width:0.6px;fill:none;"/>
    <circle cx="15" cy="3" r="0.5" style="stroke:black;fill:none;"/>
    <circle cx="15" cy="18" r="0.5" style="stroke:black;fill:none;"/>
    <circle cx="15" cy="33" r="0.5" style="stroke:black;fill:none;"/>
    <circle cx="15" cy="56" r="0.5" style="stroke:black;fill:none;"/>
    <use href="#op-amp-full-pinout" transform="translate(10,10) scale(1,1)"/>
    <use href="#ampere" transform="translate(10,-8) scale(1,1)"/>
    <line x1="70" y1="3" x2="70" y2="56" style="stroke:black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
    <circle cx="70" cy="12" r="5" style="stroke:black;fill:none;"/>
    <circle cx="70" cy="40" r="5" style="stroke:black;fill:none;"/>
    <line x1="15" y1="3" x2="70" y2="3" style="stroke:black;stroke-width:0.6px;fill:none;"/>
    <line x1="15" y1="56" x2="70" y2="56" style="stroke:black;stroke-width:0.6px;fill:none;"/>
    <line x1="66" y1="25" x2="75" y2="25" style="stroke:black;stroke-width:0.6px;fill:none;"/>

    <use href="#potentiometer_v" transform="translate(65.5,5.5)  rotate(90) scale(0.55,0.55)"/>
     <line x1="49.5" y1="40" x2="49.5" y2="56" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>

    <use href="#gnd" transform="translate(47,12) scale(0.7,0.7)"/>
    <circle cx="70" cy="25" r="0.5" style="stroke:black;fill:none;"/>
        <line x1="35" y1="3" x2="35" y2="5" style="stroke:black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
<!--    <line x1="35" y1="3" x2="35" y2="15" style="stroke:black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>-->
    <line x1="35" y1="35" x2="35" y2="55.5" style="stroke:black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>



    <use href="#gnd" transform="translate(2,32) scale(0.7,0.7)"/>
    <line x1="15" y1="45" x2="30" y2="45" style="stroke:black;stroke-width:0.6px;fill:none;"/>
    <circle cx="15" cy="45" r="0.5" style="stroke:black;fill:none;"/>

    <!--    A-->
    <circle cx="5" cy="9.5" r="0.5" style="stroke:black;fill:none;"/>
    <text x="5" y="8" font-size="5">A</text>

    <!--    B-->
    <circle cx="28" cy="9.5" r="0.5" style="stroke:black;fill:none;"/>
    <line x1="15" y1="18" x2="28" y2="9.5" style="stroke: black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
    <text x="26" y="8" font-size="5">B</text>
    <!--    C-->
    <circle cx="46" cy="25" r="0.5" style="stroke:black;fill:none;"/>
    <line x1="46" y1="9.5" x2="46" y2="25" style="stroke:black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
    <circle cx="46" cy="9.5" r="0.5" style="stroke:black;fill:none;"/>
    <text x="47" y="12" font-size="5">C</text>

<!-- lines-->
    <line x1="15" y1="45" x2="12" y2="40" style="stroke:green;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
    <line x1="12" y1="40" x2="15" y2="33" style="stroke:green;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>

    <!-- lines-->
    <line x1="15" y1="45" x2="12" y2="40" style="stroke:green;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
    <line x1="12" y1="40" x2="5" y2="10" style="stroke:green;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
<!--    <polygon points="5,45  2,40  5,30" style="stroke:green;stroke-width:0.6px;fill:none;"/>-->
