     <text x="13" y="24" font-size="5">E-</text>
     <text x="13" y="38" font-size="5">E+</text>
     <text x="13" y="7" font-size="5">+</text>
    <text x="13" y="60" font-size="5">-</text>

    <text x="13" y="50" font-size="5">0</text>

    <!-- lines-->
    <line x1="40" y1="18" x2="58" y2="18" style="stroke:blue;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
    <line x1="58" y1="18" x2="63" y2="33" style="stroke:blue;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
