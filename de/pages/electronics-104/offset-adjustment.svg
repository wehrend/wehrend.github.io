<svg width="100.00" height="100.00"
     viewBox="0.0 0.0 100.0 100.0"
     viewPort="0 0 100px 100px"
     version="1.1"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns="http://www.w3.org/2000/svg">
    <symbol id="op-amp">
        <polygon points="15,5  15,25  35,15 " style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="10" y1="10" x2="15" y2="10" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="10" y1="21" x2="15" y2="21" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="35" y1="15" x2="45" y2="15" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <text x="16" y="12" font-size="5">+</text>
        <text x="17" y="22" font-size="5">-</text>
    </symbol>
    <!-- potentiometer built from the resistor style -->
    <symbol id="potentiometer_v" viewBox="0 0 160 200">
        <!-- leads and body replicate resistor_v (centered at x=80) -->
        <line x1="80" y1="15" x2="80" y2="60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <line x1="80" y1="120" x2="80" y2="140" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <rect x="70" y="60" width="20" height="60" fill="none" stroke="currentColor" stroke-width="4"/>
        <!-- wiper (terminal 2) going to the right -->
        <line x1="80" y1="90" x2="130" y2="90" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- little triangular pointer touching the track -->
        <polygon points="92,82 80,90 92,98" fill="currentColor"/>
        <!-- external pad for the wiper -->
        <!--      <line x1="130" y1="90" x2="150" y2="90" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>-->
    </symbol>
    <!-- vertical resistor (as given) -->
    <symbol id="resistor_v" viewBox="0 0 60 200">
        <line x1="30" y1="15" x2="30" y2="60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <line x1="30" y1="120" x2="30" y2="140" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <rect x="20" y="60" width="20" height="60" fill="none" stroke="currentColor" stroke-width="4"/>
    </symbol>
    <!-- diode -->
    <symbol id="diode">
    <polyline points="55,20 60,29 66,20" fill="black" stroke="black" stroke-width="1.0"/>
    <line x1="56" y1="30" x2="64" y2="30" style="stroke:black;"/>
    </symbol>
    <!--ground-->
    <symbol id="gnd">
        <line x1="40" y1="18" x2="40" y2="22" style="stroke:black;stroke-width:1;"/>
        <polygon points="36,22 44,22 40,27" style="stroke:black;stroke-width:1;fill:none;"/>
    </symbol>
    <use href="#op-amp" transform="translate(20,30) scale(1,1)"/>
    <use href="#potentiometer_v" transform="translate(0,22) scale(0.4,0.4)"/>
    <use href="#gnd" transform="translate(2,38) scale(0.7,0.7)"/>
    <use href="#resistor_v" transform="translate(-9.8,1.5) scale(0.35,0.35)"/>
    <use href="#resistor_v" transform="translate(-9.8,45.5) scale(0.35,0.35)"/>
     <line x1="7.8" y1="25" x2="7.8" y2="50" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="8" y1="25" x2="20" y2="25" style="stroke:black;stroke-width:0.6px;fill:none;"/>
    <line x1="8" y1="50.2" x2="20" y2="50.2" style="stroke:black;stroke-width:0.6px;fill:none;"/>


    <use href="#diode" transform="translate(-22,20) scale(0.5,0.5)"/>
    <use href="#diode" transform="translate(-22,30) scale(0.5,0.5)"/>

    <text x="13" y="18" font-size="4" style="stroke:red;stroke-width:0.1 " >
        <tspan>R</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">a</tspan>

    </text>
    <text x="13" y="64" font-size="4" style="stroke:red;stroke-width:0.1 " >
        <tspan>R</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">b</tspan>

    </text>

    <!--    <line x1="40" y1="30" x2="40" y2="15" style="stroke:black;stroke-width:0.6px;fill:none;"/>-->
    <!--    <circle cx="40" cy="15" r="0.5" style="stroke:black;stroke-width:0.6px;fill:none;">-->
    <!-- <polygon points="10,21 10,30, 40,30 40,20" style="stroke:black;stroke-width:0.6px;fill:none;"/> -->
    <!--     <text x="3" y="24" font-size="5">E+</text>-->
    <!--     <text x="3" y="38" font-size="5">E-</text>-->
    <!--     <text x="3" y="8" font-size="5">+</text>-->
    <!--    <text x="3" y="50" font-size="5">0</text>-->


    <!-- <text x="42" y="16" font-size="4">V_out</text> -->


</svg>
