<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980">
  <defs>
    <style>
      .box { fill:#ffffff; stroke:#111827; stroke-width:2; }
      .title { font:16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; fill:#111827; }
      .sub { font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; fill:#374151; }
      .arrow { stroke:#111827; stroke-width:2.5; fill:none; marker-end:url(#arrowhead); }
      .label { font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; fill:#111827; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111827"/>
    </marker>
  </defs>

  <!-- Boxes (centered) -->
  <rect class="box" x="190" y="40"  width="340" height="90" rx="14" ry="14"/>
  <text class="title" x="360" y="75" text-anchor="middle">Running Program</text>
  <text class="sub"   x="360" y="100" text-anchor="middle">(normal CPU execution)</text>

  <rect class="box" x="190" y="170" width="340" height="90" rx="14" ry="14"/>
  <text class="title" x="360" y="205" text-anchor="middle">CPU</text>
  <text class="sub"   x="360" y="230" text-anchor="middle">detects interrupt signal</text>

  <rect class="box" x="190" y="300" width="340" height="90" rx="14" ry="14"/>
  <text class="title" x="360" y="335" text-anchor="middle">Save CPU State</text>
  <text class="sub"   x="360" y="360" text-anchor="middle">(PC, registers, flags)</text>

  <rect class="box" x="190" y="430" width="340" height="90" rx="14" ry="14"/>
  <text class="title" x="360" y="465" text-anchor="middle">Interrupt Vector / IDT</text>
  <text class="sub"   x="360" y="490" text-anchor="middle">select correct handler</text>

  <rect class="box" x="190" y="560" width="340" height="90" rx="14" ry="14"/>
  <text class="title" x="360" y="595" text-anchor="middle">Interrupt Service Routine</text>
  <text class="sub"   x="360" y="620" text-anchor="middle">(ISR) handle event</text>

  <rect class="box" x="190" y="690" width="340" height="90" rx="14" ry="14"/>
  <text class="title" x="360" y="725" text-anchor="middle">Restore CPU State</text>
  <text class="sub"   x="360" y="750" text-anchor="middle">resume context</text>

  <rect class="box" x="190" y="820" width="340" height="90" rx="14" ry="14"/>
  <text class="title" x="360" y="855" text-anchor="middle">Resume Program</text>
  <text class="sub"   x="360" y="880" text-anchor="middle">continue where stopped</text>

  <!-- Vertical arrows -->
  <path class="arrow" d="M360 130 L360 170"/>
  <path class="arrow" d="M360 260 L360 300"/>
  <path class="arrow" d="M360 390 L360 430"/>
  <path class="arrow" d="M360 520 L360 560"/>
  <path class="arrow" d="M360 650 L360 690"/>
  <path class="arrow" d="M360 780 L360 820"/>

  <!-- Label for the first transition -->
  <text class="label" x="360" y="155" text-anchor="middle">interrupt request</text>
</svg>
