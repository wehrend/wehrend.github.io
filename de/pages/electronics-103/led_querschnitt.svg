<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="title desc">
  <title id="title">Querschnitt einer LED</title>
  <desc id="desc">LED mit verlängerten Pins: lange Anode, kurze Kathode. Gehäuse höher dargestellt.</desc>

  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8dde3"/>
      <stop offset="50%" stop-color="#b8c0c7"/>
      <stop offset="100%" stop-color="#9aa3aa"/>
    </linearGradient>

    <radialGradient id="epoxyGrad" cx="50%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#e9f1ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#dbe7ff" stop-opacity="0.9"/>
    </radialGradient>

    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="50%" stop-color="#cfd6de"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <style>
      .label { font: 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif; fill:#1f2937; }
      .small { font-size: 12px; fill:#374151; }
      .callout { stroke:#6b7280; stroke-width:1.5; fill:none; }
      .dot { fill:#6b7280; }
    </style>
  </defs>

  <!-- Hintergrund -->
  <rect x="0" y="0" width="800" height="700" fill="#ffffff"/>

  <!-- Vergusslinse / Epoxy-Dome (höher) -->
  <path d="M140,355 Q400,30 660,355 L660,570 Q400,605 140,570 Z"
        fill="url(#epoxyGrad)" filter="url(#softShadow)"/>

  <!-- Leads (unten, länger herausgeführt) -->
  <!-- Kathode (links, kürzer) -->
  <rect x="220" y="530" width="130" height="90" rx="6" fill="url(#metalGrad)"/>
  <rect x="275" y="445" width="40" height="85" rx="5" fill="url(#metalGrad)"/>
  <!-- Pin herausgeführt -->
  <rect x="290" y="620" width="10" height="60" fill="url(#metalGrad)"/>

  <!-- Anode (rechts, länger) -->
  <rect x="450" y="530" width="130" height="90" rx="6" fill="url(#metalGrad)"/>
  <rect x="505" y="465" width="40" height="65" rx="5" fill="url(#metalGrad)"/>
  <!-- Pin herausgeführt (länger) -->
  <rect x="520" y="620" width="10" height="90" fill="url(#metalGrad)"/>

  <!-- Reflektor-Becher (auf Kathode) -->
  <path d="M245 425 Q305 340 365 425"
        stroke="url(#cupGrad)" stroke-width="34" stroke-linecap="round" fill="none"/>

  <!-- Die-Attach / Lötpad -->
  <rect x="291" y="410" width="28" height="8" rx="1.5" fill="#bfc6cd"/>

  <!-- LED-Chip (Die) -->
  <rect id="chip" x="295" y="396" width="20" height="14" rx="2" fill="#3a86ff" stroke="#1e40af" stroke-width="1.2"/>

  <!-- Bonddraht (Die -> Anodenpfosten) -->
  <path id="bond" d="M315 396 Q420 275 525 465"
        fill="none" stroke="#d4af37" stroke-width="3.2"/>

  <!-- Kleine Lichter/Reflexe -->
  <circle cx="325" cy="382" r="8" fill="#ffffff" opacity="0.45"/>
  <circle cx="590" cy="360" r="10" fill="#ffffff" opacity="0.25"/>

  <!-- Beschriftungen & Callouts -->
  <!-- Kathode -->
  <circle class="dot" cx="295" cy="550" r="3"/>
  <path class="callout" d="M295 550 L170 550"/>
  <text class="label" x="160" y="545" text-anchor="end">Anode (long lead)</text>

  <!-- Anode -->
  <circle class="dot" cx="525" cy="470" r="3"/>
  <path class="callout" d="M525 470 L690 470"/>
  <text class="label" x="700" y="465">Cathode (short lead)</text>

  <!-- Reflektor -->
  <circle class="dot" cx="305" cy="410" r="3"/>
  <path class="callout" d="M305 410 L160 385"/>
  <text class="label" x="150" y="380" text-anchor="end">Reflector</text>

  <!-- Chip -->
  <circle class="dot" cx="305" cy="398" r="3"/>
  <path class="callout" d="M305 398 L150 335"/>
  <text class="label" x="140" y="330" text-anchor="end">Chip (LED-Die)</text>

  <!-- Bonddraht -->
  <circle class="dot" cx="420" cy="350" r="3"/>
  <path class="callout" d="M420 350 L690 330"/>
  <text class="label" x="700" y="326">wire bond</text>

  <!-- Rahmenlinie -->
  <rect x="100" y="40" width="600" height="600" rx="18" ry="18"
        fill="none" stroke="#e5e7eb" stroke-width="2"/>
</svg>
