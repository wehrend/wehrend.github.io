<svg width="120" height="100" viewBox="0 0 100 100"
     xmlns="http://www.w3.org/2000/svg">

    <!-- Marker außerhalb des Symbols (robuster) -->
    <defs>
        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3"
                orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L6,3 z" fill="black"/>
        </marker>
    </defs>

    <symbol id="npn">
        <g transform="translate(0 15.5)">
            <g id="npn_classic">
                <polyline points="73,20 80,15 80,05" style="stroke:black;stroke-width:1;fill:none;"/>
                <!-- Basis -->
                <line x1="58" y1="25" x2="73" y2="25"
                      style="stroke:black;stroke-width:1;fill:none;stroke-linecap:round"/>
                <line x1="73" y1="18" x2="73" y2="31" style="stroke:black;stroke-width:1;fill:none;"/>
                <!-- Emitter -->
                <polyline points="73,28 80,35 80,42" style="stroke:black;stroke-width:1;fill:none;"/>
                <!-- Pfeil -->
                <line x1="77" y1="34" x2="80" y2="37" style="stroke:black;stroke-width:1;marker-end:url(#arrowhead)"/>
                <!-- Kreis -->
                <circle cx="76" cy="25" r="11" style="stroke:black;stroke-width:1;fill:none;"/>
            </g>
        </g>
    </symbol>

    <symbol id="capacitor" viewBox="0 0 200 60">
        <!-- Leitungen -->
        <line x1="40" y1="30" x2="80" y2="30" stroke="black" stroke-width="4" stroke-linecap="round"/>
        <line x1="90" y1="30" x2="160" y2="30" stroke="black" stroke-width="4" stroke-linecap="round"/>
        <!-- capacitor -->
        <line x1="80" y1="10" x2="80" y2="49" stroke="black" stroke-width="4"/>
        <line x1="87" y1="10" x2="87" y2="49" stroke="black" stroke-width="4"/>
    </symbol>

    <!-- IEC (EU) Rechteck -->
    <symbol id="resistor" viewBox="0 0 200 60">
        <!-- Leitungen -->
        <line x1="15" y1="30" x2="60" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <line x1="120" y1="30" x2="140" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- Widerstandskörper -->
        <rect x="60" y="20" width="60" height="20" fill="none" stroke="currentColor" stroke-width="4"/>
    </symbol>

    <!-- power line-->
    <line x1="25" y1="6" x2="92" y2="6" stroke="currentColor" stroke-width="0.7"/>
    <use href="#npn" transform="translate(-28, 1) "/>
    <g transform="translate(60,13) rotate(90)">
        <use href="#resistor" transform="translate(38,10) scale(0.5,0.5)"/>
        <use href="#resistor" transform="translate(-10,10) scale(0.5,0.5)"/>
        <use href="#resistor" transform="translate(38,-17) scale(0.5,0.5)"/>
    </g>

    <!-- ground line-->
    <line x1="0" y1="86" x2="92" y2="86" stroke="currentColor" stroke-width="0.7"/>
    <circle cx="0" cy="86" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="91" cy="86" r="1" style="stroke:black;stroke-width:1;fill: black;"/>


    <circle cx="25" cy="41.5" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <line x1="25" y1="38" x2="25" y2="56" stroke="currentColor" stroke-width="0.7"/>

    <!-- base line (EINGANG) — ersetzt durch Kondensator -->
    <!-- ALT: <line x1="12" y1="52.5" x2="30" y2="52.5" .../> -->
    <use href="#capacitor" transform="translate(-10,16.5) scale(0.5)"/>
    <circle cx="0" cy="41.5" r="1" style="stroke:black;stroke-width:1;fill:black;"/>

    <!-- collector line (AUSGANG) — Leitung verkürzt + Kondensator eingefügt -->
    <!-- ALT: <line x1="52" y1="40" x2="90" y2="40" .../> -->
    <!--  <line x1="52" y1="40" x2="72" y2="40" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>-->
    <use href="#capacitor" transform="translate(92.5,30) scale(-0.5,0.5)"/>
    <circle cx="52" cy="55" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="91" cy="55" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <line x1="80" y1="55" x2="90" y2="55" style="stroke:black;stroke-width:1;fill: black;"/>

    <line x1="52" y1="6" x2="52" y2="30" style="stroke:black;stroke-width:1;fill: black;"/>

    <use href="#capacitor" transform="translate(110,16.5) rotate(90) scale(0.5)"/>

    <line x1="85" y1="6" x2="85" y2="30" style="stroke:black;stroke-width:1;fill: black;"/>
    <line x1="85" y1="40" x2="85" y2="86" style="stroke:black;stroke-width:1;fill: black;"/>

    <text x="32" y="50" fill="blue" font-size="6">B</text>
    <text x="85" y="45" fill="blue" font-size="6">C</text>
    <text x="92.5" y="37.5" font-size="6">out</text>
    <text x="45" y="75" fill="blue" font-size="6">E</text>

    <text x="29" y="25" fill="blue" font-size="4">R_{1}</text>
    <text x="29" y="75" fill="blue" font-size="4">R_{2}</text>
    <text x="56" y="74" fill="blue" font-size="4">R_{E} = R_{L}</text>
    <text x="25" y="97" font-size="6">Common Emitter</text>

</svg>
