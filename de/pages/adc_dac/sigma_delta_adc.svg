<svg width="160" height="120"
     viewBox="40 0 160 180"
     version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">

    <symbol id="integrator">
        <polygon points="30,10  30,30  50,20 " style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="21" y1="20" x2="30" y2="20" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="50" y1="20" x2="58" y2="20" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <text x="32" y="22" font-size="12">∫</text>
    </symbol>
    <symbol id="op-amp">
        <polygon points="30,10  30,30  50,20 " style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="21" y1="15" x2="30" y2="15" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="25" y1="26" x2="30" y2="26" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="50" y1="20" x2="58" y2="20" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <text x="32" y="17" font-size="5">-</text>
        <text x="31" y="27" font-size="5">+</text>
    </symbol>
    <symbol id="capacitor">
        <line x1="3" y1="33" x2="17" y2="33" style="stroke:black;"/>
        <text x="10" y="28" font-size="6">C</text>
        <line x1="17" y1="25" x2="17" y2="40" style="stroke:black;"/>
        <line x1="20" y1="25" x2="20" y2="40" style="stroke:black;"/>
        <line x1="20" y1="33" x2="35" y2="33" style="stroke:black;"/>
    </symbol>
    <symbol id="resistor">
        <line x1="0" y1="33" x2="25" y2="33" style="stroke:black;"/>
        <text x="25" y="26" font-size="6">R</text>
        <rect x="25" y="30" width="15" height="6" style="stroke:black;fill:none"/>
        <line x1="40" y1="33" x2="80" y2="33" style="stroke:black;"/>
    </symbol>
    <symbol id="dflipflop">
        <rect x="5" y="5" width="15" height="20" style="stroke:black;stroke-width:0.5px;fill:none;"/>
        <line x1="0" y1="10" x2="5" y2="10" style="stroke:black;stroke-width:0.5px;fill:none;"/>
        <line x1="0" y1="20" x2="5" y2="20" style="stroke:black;stroke-width:0.5px;fill:none;"/>
        <text x="6" y="12" font-size="6">D</text>
<!--         <text x="6" y="22" font-size="6">Clk</text> -->
        <line x1="20" y1="10" x2="30" y2="10" style="stroke:black;stroke-width:0.5px;fill:none;"/>
        <line x1="20" y1="20" x2="26" y2="20" style="stroke:black;stroke-width:0.5px;fill:none;"/>
        <polyline points="5,18 8,20 5,22" style="stroke:black;stroke-width:0.5px;fill:none;"/>
        <text x="14" y="12" font-size="6">Q</text>
        <text x="14" y="22" text-decoration="overline" font-size="6">Q</text>
    </symbol>
    <symbol id="ground">
        <line x1="12" y1="15" x2="12" y2="19" style="stroke:black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
        <line x1="9" y1="19" x2="15" y2="19" style="stroke:black;stroke-width:0.6px;fill:none;"/>
    </symbol>
    <symbol id="switch">
<!--         <text x="5" y="26" font-size="4">in</text>-->
        <line x1="75" y1="56" x2="75" y2="20" style="fill:none;stroke:black;stroke-width:0.7px;stroke-dasharray:2.2;"/>
        <text x="78" y="55" font-size="4">Out</text>
        <line x1="65" y1="25" x2="82" y2="18" style="fill:none;stroke:black;stroke-width:0.7px;"/>
        <line x1="82" y1="18" x2="90" y2="18" style="fill:none;stroke:black;stroke-width:0.7px;"/>
        <circle cx="82" cy="18" r="0.5" style="fill:black;stroke:black;stroke-width:0.7px;"/>
        <text x="92" y="19" font-size="4">V<tspan dy="1">ref</tspan></text>
        <line x1="82" y1="32" x2="90" y2="32" style="fill:none;stroke:black;stroke-width:0.7px;"/>
        <circle cx="82" cy="32" r="0.5" style="fill:black;stroke:black;stroke-width:0.7px;"/>
        <text x="92" y="33" font-size="4">GND</text>
         <!--     out -->
        <line x1="55" y1="25" x2="65" y2="25" style="fill:none;stroke:black;stroke-width:0.7px;"/>
<!--        <text x="50" y="26" font-size="4">in</text>-->

    </symbol>
    <!--    upper layer-->
    <rect x="15" y="12" width="40" height="35" style="fill:lightblue"/>
    <rect x="53.5" y="30" width="80" height="35" style="fill:salmon"/>
    <rect x="110" y="0" width="42" height="25" style="fill:lightyellow"/>
    <use href="#capacitor" transform="translate(25, -5) scale(0.8,0.8)"/>
    <line x1="20" y1="21.5" x2="38" y2="21.5" style="stroke:black;"/>
    <line x1="55" y1="35" x2="67" y2="35" style="stroke:black;"/>
    <line x1="20" y1="10" x2="20" y2="30" style="stroke:black;"/>
    <line x1="53" y1="21" x2="53" y2="35" style="stroke:black;"/>
    <circle cx="20" cy="21.5" r="0.8" style="stroke:black;"/>
    <circle cx="53" cy="35" r="0.8" style="stroke:black;"/>
    <use href="#op-amp" transform="translate(0,15)"/>
    <use href="#resistor" transform="translate(40,-16) scale(0.8,0.8)"/>
    <use href="#op-amp" transform="translate(37, 61) scale(1,-1)"/>
    <circle cx="58" cy="55" r="4.0" style="stroke:black;stroke-width:0.7px;fill:none" />
    <text x="55.5" y="58" font-size="8">=</text>
    <line x1="58" y1="46" x2="58" y2="52" style="stroke:black;stroke-width:0.7px;"/>
    <use href="#ground"  transform="translate(46,44)"/>
    <line x1="20" y1="10" x2="20" y2="30" style="stroke:black;"/>
    <use href="#dflipflop" transform="translate(90, 31) scale(1,1)"/>
    <line x1="20" y1="10.5" x2="50" y2="10.5" style="stroke:black;stroke-width:0.7px;"/>
    <use href="#switch"  transform="translate(45,-14.5)"/>
    <use href="#ground"  transform="translate(123,2.2)"/>

    <!--    lower layer-->
    <rect x="35" y="68" width="60" height="30" style="fill:lightblue"/>
    <rect x="93.5" y="68" width="40" height="30" style="fill:salmon"/>
    <rect x="76" y="100" width="32" height="25" style="fill:lightyellow"/>
    <line x1="20" y1="80.5" x2="45" y2="80.5" style="stroke:black;stroke-width:0.7px;"/>
    <circle cx="50" cy="80" r="5.0" style="stroke:black;stroke-width:0.7px;fill:none" />
    <text x="47" y="84" font-size="12">+</text>
    <line x1="55" y1="80" x2="65" y2="80" style="stroke:black;stroke-width:0.7px;"/>
    <use href="#integrator" transform="translate(40,60)"/>
    <rect x="98" y="68" width="25" height="25" style="fill:none;stroke:black;stroke-width:0.5px; "/>
    <text x="102" y="75" font-size="8">1-Bit</text>
    <text x="102" y="85" font-size="8">ADC</text>
    <line x1="122" y1="80" x2="135" y2="80" style="stroke:black;stroke-width:0.7px;"/>
    <rect x="135" y="68" width="25" height="25" style="fill:none;stroke:black;stroke-width:0.5px; "/>
    <text x="139" y="75" font-size="8">digital</text>
    <text x="139" y="85" font-size="8">Filter</text>
    <line x1="160" y1="80" x2="170" y2="80" style="stroke:black;stroke-width:0.7px;"/>
    <text x="168" y="82" font-size="8">D0</text>
    <line x1="50" y1="85" x2="50" y2="115" style="stroke:black;"/>ŝ
    <line x1="128" y1="80" x2="128" y2="115" style="stroke:black;"/>
    <circle cx="128" cy="80" r="0.8" style="stroke:black;"/>
    <rect x="80" y="100" width="25" height="25" style="fill:none;stroke:black;stroke-width:0.5px;"/>
    <text x="85" y="110" font-size="8">1-Bit</text>
    <text x="85" y="120" font-size="8">DAC</text>
    <line x1="50" y1="114" x2="80" y2="114" style="stroke:black;stroke-width:0.7px;"/>
    <line x1="105" y1="114" x2="128" y2="114" style="stroke:black;stroke-width:0.7px;"/>
    <text x="38" y="78" font-size="12">Δ</text>
    <text x="60" y="78" font-size="12">Σ</text>
</svg>