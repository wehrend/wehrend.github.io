<svg width="600" height="270" viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg" version="1.1">
    <defs>
        <marker id="arrow" markerWidth="5" markerHeight="8" refX="2.5" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L3,3z" fill="black" />
        </marker>
    </defs>
    <style>
        line, polyline { fill:none; stroke:black; stroke-width:0.5px; }
        text { font-family: sans-serif; }
    </style>

    <!-- input x -->
    <text x="2" y="44" font-size="5">x</text>
    <line x1="8" y1="42" x2="34" y2="42" marker-end="url(#arrow)"/>
    <circle cx="16" cy="42" r="0.9" fill="black"/>

    <!-- next state logic delta -->
    <rect x="36" y="30" width="26" height="30" style="fill:lightgreen;stroke:black;stroke-width:0.5px;"/>
    <text x="45" y="49" font-size="10">δ</text>

    <!-- delta -> state register -->
    <line x1="62" y1="45" x2="82" y2="45" marker-end="url(#arrow)"/>
    <text x="68" y="42" font-size="4">q'</text>

    <!-- state register -->
    <rect x="84" y="30" width="22" height="30" style="fill:lightskyblue;stroke:black;stroke-width:0.5px;"/>
    <polyline points="84,30 87,34 90,30" style="fill:lightskyblue;stroke:black;stroke-width:0.5px;"/>
    <text x="88" y="46" font-size="3.5">State</text>
    <text x="86" y="51" font-size="3.5">register</text>

    <!-- clock -->
    <text x="89" y="8" font-size="3.5">Clock</text>
    <line x1="95" y1="10" x2="95" y2="27" marker-end="url(#arrow)"/>

    <!-- register -> output logic -->
    <line x1="106" y1="45" x2="140" y2="45" marker-end="url(#arrow)"/>
    <text x="120" y="42" font-size="4">q</text>
    <circle cx="116" cy="45" r="0.9" fill="black"/>

    <!-- feedback q -> delta -->
    <polyline points="116,45 116,75 26,75 26,52 34,52" marker-end="url(#arrow)"/>

    <!-- output logic lambda -->
    <rect x="142" y="30" width="26" height="30" style="fill:lightgreen;stroke:black;stroke-width:0.5px;"/>
    <text x="151" y="49" font-size="10">λ</text>

    <!-- output z -->
    <line x1="168" y1="45" x2="186" y2="45" marker-end="url(#arrow)"/>
    <text x="190" y="47" font-size="5">z</text>

    <!-- Mealy only: input directly to output logic (dashed) -->
    <polyline points="16,42 16,18 155,18 155,27" style="stroke-dasharray:2,1.5;" marker-end="url(#arrow)"/>
</svg>
