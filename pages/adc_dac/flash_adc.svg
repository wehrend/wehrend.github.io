    <circle cx="60" cy="55" r="1.0" style="stroke:black"/>
    <circle cx="60" cy="87" r="1.0" style="stroke:black"/>
    <line x1="60" y1="2" x2="60" y2="120" style="stroke:black"/>
    <use href="#inverter" transform="translate(110,45.5) scale(0.33, 0.33)"/>
    <use href="#inverter" transform="translate(110,78.5) scale(0.33, 0.33)"/>
    <use href="#inverter" transform="translate(110,110.5) scale(0.33, 0.33)"/>
    <use href="#nand" transform="translate(150,39.5) scale(0.3, 0.3)"/>
    <line x1="116" y1="30" x2="116" y2="47" style="stroke:black"/>
    <line x1="116" y1="47" x2="158" y2="47" style="stroke:black"/>
    <use href="#nand" transform="translate(150,72.5) scale(0.3, 0.3)"/>
    <circle cx="110" cy="62" r="1.0" style="stroke:black"/>
    <line x1="110" y1="62" x2="110" y2="80" style="stroke:black"/>
    <line x1="110" y1="80" x2="158" y2="80" style="stroke:black"/>
    <circle cx="110" cy="95" r="1.0" style="stroke:black"/>
    <line x1="110" y1="95" x2="110" y2="112" style="stroke:black"/>
    <line x1="110" y1="112" x2="158" y2="112" style="stroke:black"/>
    <use href="#nand" transform="translate(150,104.5) scale(0.3, 0.3)"/>

    <use href="#nand" transform="translate(190,60.5) scale(0.3, 0.3)"/>
    <use href="#nand" transform="translate(190,90.5) scale(0.3, 0.3)"/>
    <line x1="189" y1="113" x2="189" y2="120" style="stroke:black"/>
    <line x1="189" y1="113" x2="195" y2="113" style="stroke:black"/>
    <circle cx="193" cy="68" r="1.0" style="stroke:black"/>
    <line x1="189" y1="88" x2="189" y2="83" style="stroke:black"/>
    <line x1="189" y1="83" x2="195" y2="83" style="stroke:black"/>
    <line x1="193" y1="55" x2="193" y2="98" style="stroke:black"/>
    <line x1="185" y1="54.5" x2="193.5" y2="54.5" style="stroke:black"/>
    <text x="25" y="5" font-size="6">V_ref</text>
    <text x="60" y="5" font-size="6">V_in</text>
    <text x="32" y="24" font-size="6">R/2</text>
    <text x="32" y="60" font-size="6">R</text>
    <text x="32" y="90" font-size="6">R</text>
    <text x="32" y="90" font-size="6">R</text>
    <text x="32" y="125" font-size="6">R</text>
    <text x="32" y="155" font-size="6">R/2</text>
    <text x="230" y="78" font-size="6">B1</text>
    <text x="230" y="108" font-size="6">B0</text>
</svg>
