<svg width="160" height="120"
     viewBox="40 0 160 180"
     version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <symbol id="resistor">
        <line x1="23" y1="15" x2="35" y2="15" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <rect x="15" y="13.5" width="8" height="3" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="7" y1="15" x2="15" y2="15" style="stroke:black;stroke-width:0.6px;fill:none;"/>
    </symbol>
    <symbol id="resistor_v">
        <line x1="45" y1="33" x2="45" y2="50" style="stroke:black;"/>
        <line x1="45" y1="65" x2="45" y2="80" style="stroke:black;"/>
        <rect x="42" y="50" width="6" height="15" style="stroke:black;fill:none"/>
    </symbol>
    <symbol id="comparator">
        <polygon points="30,10  30,30  50,20 " style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="20" y1="15" x2="30" y2="15" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="25" y1="26" x2="30" y2="26" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <line x1="50" y1="20" x2="58" y2="20" style="stroke:black;stroke-width:0.6px;fill:none;"/>
        <text x="32" y="17" font-size="5">-</text>
        <text x="31" y="27" font-size="5">+</text>
    </symbol>
    <symbol id="ground">
        <line x1="12" y1="15" x2="12" y2="19" style="stroke:black;stroke-width:0.6px;fill:none;stroke-linecap:round;"/>
        <line x1="9" y1="19" x2="15" y2="19" style="stroke:black;stroke-width:0.6px;fill:none;"/>
    </symbol>
    <symbol id="inverter">
        <!--inputs-->
      <line x1= "10" y1="50" x2="30" y2="50" style="fill:#ffffff;stroke:#000000" stroke-width="2px"/>
      <!--output-->
      <line x1= "94" y1="50" x2="130" y2="50" style="fill:#ffffff;stroke:#000000" stroke-width="2px"/>
      <circle cx="93" cy="50" r="3" style="fill:#ffffff;stroke:#000000" />
      <polyline
         points="30,10 90,50 30,90 30,10 90,50"
         style="fill:none;stroke:#000000"
         stroke-width="2px"
         id="polyline5"/>
    </symbol>
     <symbol id="nand">
         <!--inputs-->
          <line x1= "10" y1="25" x2="30" y2="25" style="fill:#ffffff;stroke:#000000" stroke-width="2px"/>
          <line x1= "10" y1="75" x2="30" y2="75" style="fill:#ffffff;stroke:#000000" stroke-width="2px"/>
          <!--output-->
          <line x1= "94" y1="50" x2="130" y2="50" style="fill:#ffffff;stroke:#000000" stroke-width="2px"/>
          <circle cx="113" cy="50" r="3" style="fill:#ffffff;stroke:#000000"/>
          <polyline
             points="70,10 30,10 30,90, 70,90"
             style="fill:#ffffff;stroke:#000000"
             stroke-width="2px"
             id="polyline5" />
          <path
             id="ellipse8"
             style="fill:#ffffff;stroke:#000000;stroke-width:2px"
             d="m 69.504453,10.00307 a 40,40 0 0 1 34.935157,19.652064 40,40 0 0 1 0.352,40.081724 40,40 0 0 1 -34.584606,20.262606" />
        </symbol>
    <circle cx="45" cy="2" r="1.0" style="stroke:black"/>
    <circle cx="60" cy="2" r="1.0" style="stroke:black"/>
    <use href="#resistor_v" transform="translate(0,-32)"/>
    <use href="#resistor_v" transform="translate(0,0)"/>
    <use href="#resistor_v" transform="translate(0,32)"/>
    <use href="#resistor_v" transform="translate(0,64)"/>
    <use href="#resistor_v" transform="translate(0,95)"/>
    <use href="#ground" transform="translate(21,140) scale(2,2)"/>
