<svg width="130.00" height="60.00"
     viewBox="0.0 0.0 130.0 60.0"
     version="1.1"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns="http://www.w3.org/2000/svg">

    <symbol id="dlatch">
        <rect x="5" y="5" width="15" height="20" style="stroke:black;stroke-width:0.5px;fill:none;"/>
        <line x1="0" y1="10" x2="5" y2="10" style="stroke:black;stroke-width:0.5px;fill:none;"/>
        <line x1="0" y1="20" x2="5" y2="20" style="stroke:black;stroke-width:0.5px;fill:none;"/>
        <text x="6" y="12" font-size="6">D</text>
        <text x="6" y="21.5" font-size="4">EN</text>
        <line x1="20" y1="10" x2="26" y2="10" style="stroke:black;stroke-width:0.5px;fill:none;"/>
        <text x="14" y="12" font-size="6">Q</text>
    </symbol>

    <!-- master and slave latch -->
    <use href="#dlatch" x="40" y="10"/>
    <use href="#dlatch" x="80" y="10"/>
    <text x="47" y="41" font-size="4">Master</text>
    <text x="88" y="41" font-size="4">Slave</text>

    <!-- data path: D -> master -> slave -> Q -->
    <text x="10" y="21" font-size="5">D</text>
    <line x1="16" y1="20" x2="40" y2="20" style="stroke:black;stroke-width:0.5px;fill:none;"/>
    <line x1="66" y1="20" x2="80" y2="20" style="stroke:black;stroke-width:0.5px;fill:none;"/>
    <text x="70" y="18" font-size="4">M</text>
    <line x1="106" y1="20" x2="112" y2="20" style="stroke:black;stroke-width:0.5px;fill:none;"/>
    <text x="113" y="21.5" font-size="5">Q</text>

    <!-- clock: inverted to the master, direct to the slave -->
    <text x="8" y="51" font-size="5">Clk</text>
    <line x1="17" y1="50" x2="75" y2="50" style="stroke:black;stroke-width:0.5px;fill:none;"/>
    <circle cx="25" cy="50" r="0.6" style="stroke:black;stroke-width:0.5px;fill:black;"/>
    <line x1="25" y1="50" x2="25" y2="36" style="stroke:black;stroke-width:0.5px;fill:none;"/>
    <!-- inverter -->
    <polygon points="22,36 28,36 25,33" style="stroke:black;stroke-width:0.5px;fill:none;"/>
    <circle cx="25" cy="32.2" r="0.8" style="stroke:black;stroke-width:0.5px;fill:none;"/>
    <polyline points="25,31.4 25,30 40,30" style="stroke:black;stroke-width:0.5px;fill:none;"/>
    <polyline points="75,50 75,30 80,30" style="stroke:black;stroke-width:0.5px;fill:none;"/>
</svg>
