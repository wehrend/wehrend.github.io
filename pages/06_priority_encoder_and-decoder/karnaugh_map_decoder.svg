  <line class="thin" x1="220" y1="780" x2="220" y2="900"/>
  <line class="thin" x1="300" y1="780" x2="300" y2="900"/>
  <line class="thin" x1="380" y1="780" x2="380" y2="900"/>
  <line class="thin" x1="140" y1="840" x2="460" y2="840"/>

