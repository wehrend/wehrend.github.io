  <text class="lbl" x="710" y="760">A₁A₀</text>

  <text class="lbl" x="750" y="760">00</text>
  <text class="lbl" x="830" y="760">01</text>
  <text class="lbl" x="910" y="760">11</text>
  <text class="lbl" x="990" y="760">10</text>

  <text class="lbl" x="610" y="820">0</text>
