  <text class="cell" x="260" y="1110">0</text>
  <text class="cell" x="340" y="1110">0</text>
  <text class="cell" x="420" y="1110">0</text>

  <text class="cell" x="180" y="1170">0</text>
  <text class="cell" x="260" y="1170">0</text>
  <text class="cell" x="340" y="1170">1</text>
  <text class="cell" x="420" y="1170">0</text>


