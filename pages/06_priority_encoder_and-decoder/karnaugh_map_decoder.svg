  <line class="thin" x1="220" y1="480" x2="220" y2="600"/>
  <line class="thin" x1="300" y1="480" x2="300" y2="600"/>
  <line class="thin" x1="380" y1="480" x2="380" y2="600"/>
  <line class="thin" x1="140" y1="540" x2="460" y2="540"/>

