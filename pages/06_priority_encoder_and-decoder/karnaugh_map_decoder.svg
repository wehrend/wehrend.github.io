  <line class="thin" x1="870" y1="180" x2="870" y2="300"/>
  <line class="thin" x1="630" y1="240" x2="950" y2="240"/>

  <!-- D1 values: row A2=0 [m0,m1,m3,m2]=[0,0,X,1]; row A2=1 [X,X,X,X] -->
  <text class="cell" x="670" y="210">0</text>
  <text class="cell" x="750" y="210">0</text>
  <text class="cell" x="830" y="210">X</text>
  <text class="cell" x="910" y="210">1</text>

  <text class="cell" x="670" y="270">X</text>
  <text class="cell" x="750" y="270">X</text>
  <text class="cell" x="830" y="270">X</text>
  <text class="cell" x="910" y="270">X</text>


