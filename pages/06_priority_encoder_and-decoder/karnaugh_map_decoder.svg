  <text class="lbl" x="910" y="160">11</text>
  <text class="lbl" x="990" y="160">10</text>

  <text class="lbl" x="610" y="220">0</text>
  <text class="lbl" x="610" y="280">1</text>

  <rect class="grid" x="630" y="180" width="320" height="120"/>
