  <rect x="300" y="1140" width="70" height="60" rx="15" ry="15" style="fill:none;stroke:red;stroke-width:1px;"/>
  <text class="hdr" x="30" y="1010">D₆</text>
  <text class="lbl" x="220" y="1060">A₁A₀</text>

  <text class="lbl" x="260" y="1060">00</text>
  <text class="lbl" x="340" y="1060">01</text>
  <text class="lbl" x="420" y="1060">11</text>
  <text class="lbl" x="500" y="1060">10</text>

  <text class="lbl" x="120" y="1120">0</text>
  <text class="lbl" x="120" y="1180">1</text>

  <rect class="grid" x="140" y="1080" width="320" height="120"/>
  <line class="thin" x1="220" y1="1080" x2="220" y2="1200"/>
  <line class="thin" x1="300" y1="1080" x2="300" y2="1200"/>
  <line class="thin" x1="380" y1="1080" x2="380" y2="1200"/>
  <line class="thin" x1="140" y1="1140" x2="460" y2="1140"/>

  <!-- D6 values: row A2=0 [0,0,0,0]; row A2=1 [0,0,1,0] (m7=1 at col 11) -->
