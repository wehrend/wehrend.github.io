  <text class="lbl" x="220" y="460">A₁A₀</text>

  <text class="lbl" x="260" y="460">00</text>
  <text class="lbl" x="340" y="460">01</text>
  <text class="lbl" x="420" y="460">11</text>
  <text class="lbl" x="500" y="460">10</text>

