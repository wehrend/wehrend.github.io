<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1240" viewBox="0 0 980 1240">
  <defs>
    <style>
      .grid { stroke:#111; stroke-width:2; fill:none; }
      .thin { stroke:#111; stroke-width:1; }
      .hdr  { font-family: Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; fill:#111; }
      .lbl  { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#111; }
      .cell { font-family: Arial, Helvetica, sans-serif; font-size:22px; fill:#111;
              text-anchor:middle; dominant-baseline:middle; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size:13px; fill:#333; }
    </style>
  </defs>

  <!-- Header -->
  <text class="hdr" x="30" y="32">Karnaugh-Maps (3 Variablen) für Decoder-Ausgänge D₀…D₇ (aus deiner Tabelle)</text>
  <text class="note" x="30" y="54">
    3-Variablen-K-Map: Zeilen A₂ = 0/1; Spalten A₁A₀ im Gray-Code 00,01,11,10. "x" → X (Don’t Care).
  </text>

  <!-- ======= Block template constants (implicit) =======
       Each map:
       origin (x0,y0), grid at (x0+110, y0+70), cellW=80, cellH=60
       gridW=320, gridH=120
       col centers: gx+40,120,200,280 ; row centers: gy+30,90
  -->

  <!-- ===================== D0 ===================== -->
  <rect x="150" y="240" width="300" height="60" rx="15" ry="15" style="fill:green;stroke:none;stroke-width:0.5px;"/>
  <rect x="300" y="180" width="150" height="120" rx="15" ry="15" style="fill:lightblue;stroke:none;stroke-width:1px;"/>
  <rect x="220" y="180" width="150" height="120" rx="15" ry="15" style="fill:salmon;stroke:none;stroke-width:1px;"/>
  <text class="hdr" x="30" y="110">D₀</text>
  <text class="lbl" x="70" y="160">A₂</text>
  <text class="lbl" x="220" y="160">A₁A₀</text>

  <text class="lbl" x="260" y="160">00</text>
  <text class="lbl" x="340" y="160">01</text>
  <text class="lbl" x="420" y="160">11</text>
  <text class="lbl" x="500" y="160">10</text>

  <text class="lbl" x="120" y="220">0</text>
  <text class="lbl" x="120" y="280">1</text>

  <rect class="grid" x="140" y="180" width="320" height="120"/>
  <line class="thin" x1="220" y1="180" x2="220" y2="300"/>
  <line class="thin" x1="300" y1="180" x2="300" y2="300"/>
  <line class="thin" x1="380" y1="180" x2="380" y2="300"/>
  <line class="thin" x1="140" y1="240" x2="460" y2="240"/>

  <!-- D0 values: row A2=0 [m0,m1,m3,m2]=[0,1,X,X]; row A2=1 [m4,m5,m7,m6]=[X,X,X,X] -->
  <text class="cell" x="180" y="210">0</text>
  <text class="cell" x="260" y="210">1</text>
  <text class="cell" x="340" y="210">X</text>
  <text class="cell" x="420" y="210">X</text>

  <text class="cell" x="180" y="270">X</text>
  <text class="cell" x="260" y="270">X</text>
  <text class="cell" x="340" y="270">X</text>
  <text class="cell" x="420" y="270">X</text>


  <!-- ===================== D1 ===================== -->
  <rect x="640" y="240" width="300" height="60" rx="15" ry="15" style="fill:green;stroke:none;stroke-width:0.5px;"/>
  <rect x="800" y="180" width="150" height="120" rx="15" ry="15" style="fill:lightblue;stroke:none;stroke-width:1px;"/>
  <text class="hdr" x="520" y="110">D₁</text>
  <text class="lbl" x="710" y="160">A₁A₀</text>

  <text class="lbl" x="750" y="160">00</text>
