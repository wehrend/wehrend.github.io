<svg xmlns="http://www.w3.org/2000/svg" width="526" height="358" viewBox="0 0 526 358">
  <rect width="100%" height="100%" fill="white"/>

  <!-- Labels -->
  <text x="65" y="80" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#111">y<tspan baseline-shift="sub" font-size="26">0</tspan></text>

  <!-- Top bars / labels -->
  <g stroke="#111" stroke-width="4" stroke-linecap="square">
    <line x1="250" y1="35" x2="505" y2="35"/>
    <line x1="210" y1="67" x2="410" y2="67"/>
    <line x1="190" y1="87" x2="275" y2="87"/>
    <line x1="360" y1="87" x2="450" y2="87"/>
  </g>
  <text x="377" y="28" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111">S<tspan baseline-shift="sub" font-size="16">in</tspan></text>
  <text x="292" y="61" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">x<tspan baseline-shift="sub" font-size="16">j+2</tspan></text>
  <text x="222" y="83" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">x<tspan baseline-shift="sub" font-size="16">j</tspan></text>
  <text x="395" y="83" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">x<tspan baseline-shift="sub" font-size="16">j</tspan></text>

  <!-- Outer frame -->
  <rect x="95" y="125" width="413" height="207" fill="none" stroke="#111" stroke-width="4"/>

  <!-- Main divider -->
  <line x1="301" y1="125" x2="301" y2="332" stroke="#111" stroke-width="4"/>

  <!-- Left grid lines -->
  <g stroke="#111" stroke-width="3">
    <line x1="148" y1="125" x2="148" y2="176"/>
    <line x1="199" y1="125" x2="199" y2="227"/>
    <line x1="95" y1="176" x2="199" y2="176"/>
    <line x1="95" y1="227" x2="301" y2="227" stroke-width="4"/>
    <line x1="95" y1="176" x2="199" y2="176"/>
  </g>

  <!-- Top-left small cells outlines -->
  <rect x="95" y="125" width="53" height="51" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="148" y="125" width="51" height="51" fill="none" stroke="#111" stroke-width="3"/>

  <!-- Middle-left merged cell outline (col1+col2, between hy1..mid) -->
  <rect x="95" y="176" width="104" height="51" fill="none" stroke="#111" stroke-width="3"/>

  <!-- Big 0 cell outline (col3, top+mid) -->
  <rect x="199" y="125" width="102" height="102" fill="none" stroke="#111" stroke-width="3"/>

  <!-- Colored blocks -->
  <rect x="103" y="229" width="190" height="97" rx="18" ry="18" fill="#77c8f2" opacity="0.95"/>
  <rect x="103" y="182" width="88" height="61" rx="18" ry="18" fill="#e1231a" opacity="0.95"/>

  <!-- Text in cells -->
  <text x="121.5" y="160.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#6cbf2a">*</text>
  <text x="173.5" y="161.72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">0</text>
  <text x="147.0" y="211.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">0</text>
  <text x="250.0" y="188.24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111">0</text>

  <text x="147.0" y="220.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111">1</text>
  <text x="198.0" y="285.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111">1</text>

  <text x="404.5" y="228.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#6cbf2a">*</text>

  <!-- Left measurement marks (approx) -->
  <g stroke="#111" stroke-width="4" fill="none">
    <line x1="70" y1="135" x2="70" y2="322"/>
    <line x1="85" y1="171" x2="85" y2="237"/>
  </g>
  <text x="50" y="228.5" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111" transform="rotate(-90 50 228.5)">x<tspan baseline-shift="sub" font-size="16">i+3</tspan></text>
  <text x="75" y="211.5" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111" transform="rotate(-90 75 211.5)">x<tspan baseline-shift="sub" font-size="16">i+1</tspan></text>
</svg>