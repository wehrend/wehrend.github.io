<svg width="120" height="100" viewBox="0 0 100 100"
     xmlns="http://www.w3.org/2000/svg">

    <!-- Marker außerhalb des Symbols (robuster) -->
    <defs>
        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3"
                orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L6,3 z" fill="black"/>
        </marker>
    </defs>

    <symbol id="npn">
        <g transform="translate(0 15.5)">
            <g id="npn_classic">
                <polyline points="73,20 80,15 80,05" style="stroke:black;stroke-width:1;fill:none;"/>
                <!-- Basis -->
                <line x1="58" y1="25" x2="73" y2="25"
                      style="stroke:black;stroke-width:1;fill:none;stroke-linecap:round"/>
                <line x1="73" y1="18" x2="73" y2="31" style="stroke:black;stroke-width:1;fill:none;"/>
                <!-- Emitter -->
                <polyline points="73,28 80,35 80,42" style="stroke:black;stroke-width:1;fill:none;"/>
                <!-- Pfeil -->
                <line x1="77" y1="34" x2="80" y2="37" style="stroke:black;stroke-width:1;marker-end:url(#arrowhead)"/>
                <!-- Kreis -->
                <circle cx="76" cy="25" r="11" style="stroke:black;stroke-width:1;fill:none;"/>
            </g>
        </g>
    </symbol>

<!-- Lamp (LA1) skaliert auf 25% -->
<symbol id="lamp" viewBox="0 0 200 100">
  <circle cx="150" cy="52.5" r="11.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <line x1="141.25" y1="43.75" x2="158.75" y2="61.25" stroke="currentColor" stroke-width="1.5"/>
  <line x1="158.75" y1="43.75" x2="141.25" y2="61.25" stroke="currentColor" stroke-width="1.5"/>
  <text x="160" y="53.75" font-size="7" fill="#0a0">LA1</text>
  <text x="160" y="61.25" font-size="6" fill="#0a0">Lamp</text>
</symbol>

    <!-- amperemeter (LA1) -->
<symbol id="ampere" viewBox="0 0 200 100">
  <circle cx="100" cy="52.5" r="11.25" fill="none" stroke="red" stroke-width="1.5"/>
  <text x="95" y="55" font-size="14" fill="#0a0">A</text>
</symbol>


    <!-- IEC (EU) Rechteck -->
    <symbol id="resistor" viewBox="0 0 200 60">
        <!-- Leitungen -->
        <line x1="120" y1="30" x2="190" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- Widerstandskörper -->
        <rect x="60" y="20" width="60" height="20" fill="none" stroke="currentColor" stroke-width="4"/>
    </symbol>
    <!-- vertical resistor (as given) -->
    <symbol id="resistor_v" viewBox="0 0 60 200">
        <line x1="30" y1="15" x2="30" y2="60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <line x1="30" y1="120" x2="30" y2="140" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <rect x="20" y="60" width="20" height="60" fill="none" stroke="currentColor" stroke-width="4"/>
    </symbol>

    <!-- potentiometer built from the resistor style -->
    <symbol id="potentiometer_v" viewBox="0 0 160 200">
        <!-- leads and body replicate resistor_v (centered at x=80) -->
        <line x1="80" y1="15" x2="80" y2="60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <line x1="80" y1="120" x2="80" y2="140" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <rect x="70" y="60" width="20" height="60" fill="none" stroke="currentColor" stroke-width="4"/>
        <!-- wiper (terminal 2) going to the right -->
        <line x1="80" y1="90" x2="130" y2="90" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- little triangular pointer touching the track -->
        <polygon points="92,82 80,90 92,98" fill="currentColor"/>
        <!-- external pad for the wiper -->
        <!--      <line x1="130" y1="90" x2="150" y2="90" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>-->
    </symbol>

    <line x1="70" y1="10" x2="70" y2="40" stroke="currentColor" stroke-width="0.8"/>
    <line x1="70" y1="82" x2="70" y2="91.5" stroke="currentColor" stroke-width="0.8"/>
    <circle cx="0" cy="50" r="9" style="stroke:black;fill:none;"/>
    <line x1="0" y1="10" x2="0" y2="91" style="stroke:black;" stroke-linecap="round"/>
    <use href="#npn" x="-10" y="25"/>
    <use href="#resistor" x="30" y="81" transform="scale(0.5,0.5)" color="black"/>

    <line x1="0" y1="10" x2="70" y2="10" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="0" y1="91" x2="70" y2="91" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>

    <!--    <line x1="56" y1="43" x2="70" y2="65.5" stroke="currentColor" stroke-width="0.7"/>-->
