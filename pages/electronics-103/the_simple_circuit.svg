    <use href="#potentiometer_v" x="-15" y="86" transform="scale(0.5,0.5)" color="black"/>
    <line x1="17.5" y1="75" x2="17.5" y2="91" stroke="currentColor" stroke-width="0.8"/>
    <line x1="17.5" y1="10" x2="17.5" y2="58" stroke="currentColor" stroke-width="0.8"/>
<use href="#potentiometer_v" x="-15" y="86" transform="scale(0.5,0.5)" color="black"/>
