<svg width="120" height="100" viewBox="0 0 100 100"
     xmlns="http://www.w3.org/2000/svg">

    <!-- Marker für Pfeil -->
    <defs>
        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3"
                orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L6,3 z" fill="black"/>
        </marker>
    </defs>

    <symbol id="fet_classic">
        <line x1="75" y1="62" x2="75" y2="66" style="stroke:black;stroke-width:1;fill:none;"/>
        <line x1="75" y1="68" x2="75" y2="72" style="stroke:black;stroke-width:1;fill:none;"/>
        <line x1="75" y1="74" x2="75" y2="78" style="stroke:black;stroke-width:1;fill:none;"/>
        <!--Source-->
<!--        <text x="81" y="85" font-size="5">S</text>-->
        <polyline points="75,76 80,76 80,85" style="stroke:black;stroke-width:1;fill:none;"/>
        <polyline points="75,70 80,70 80,85" style="stroke:black;stroke-width:1;fill:none;"/>
        <g id="arrow" rotate="90">
            <polygon points="78,69 76,70 78,71 78,69" stroke="black"/>
        </g>
        <!--Gate-->
<!--        <text x="58" y="78" font-size="5">G</text>-->
        <line x1="62" y1="76" x2="73" y2="76" style="stroke:black;stroke-width:1;fill:none;stroke-linecap:round"/>
        <line x1="73" y1="63" x2="73" y2="76" style="stroke:black;stroke-width:1;fill:none;"/>
        <!--Drain-->
<!--        <text x="81" y="57" font-size="5">D</text>-->
        <polyline points="75,64 80,64 80,53" style="stroke:black;stroke-width:1;fill:none;"/>
        <!--Circle-->
        <circle cx="76" cy="70" r="11" style="stroke:black;stroke-width:1;fill:none;"/>
    </symbol>
    <!-- Kondensator -->
    <symbol id="capacitor" viewBox="0 0 200 60">
        <line x1="20" y1="30" x2="80" y2="30" stroke="black" stroke-width="4" stroke-linecap="round"/>
        <line x1="90" y1="30" x2="160" y2="30" stroke="black" stroke-width="4" stroke-linecap="round"/>
        <line x1="80" y1="10" x2="80" y2="49" stroke="black" stroke-width="4"/>
        <line x1="87" y1="10" x2="87" y2="49" stroke="black" stroke-width="4"/>
    </symbol>

    <!-- Widerstand vertikal -->
    <symbol id="resistor_v" viewBox="0 0 60 200">
        <line x1="30" y1="15" x2="30" y2="60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <line x1="30" y1="120" x2="30" y2="140" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <rect x="20" y="60" width="20" height="60" fill="none" stroke="currentColor" stroke-width="4"/>
    </symbol>

    <!-- Platzierung Symbole -->
    <use href="#fet_classic" transform="translate(-60,-29) rotate(-90 76 40.5)"/>
    <!-- Hier: vertikaler Widerstand an Basis (46,50) bis Masse (71) -->
    <use href="#resistor_v" transform="translate(0,15) scale(0.5,0.5)"/>

    <use href="#resistor_v" transform="translate(45,15) scale(0.5,0.5)"/>

    <!--     first resistor -->
    <line x1="25" y1="8" x2="25" y2="20" stroke="currentColor" stroke-width="0.8"/>
    <line x1="25" y1="45" x2="25" y2="60" stroke="currentColor" stroke-width="0.8"/>
    <circle cx="25" cy="8" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="25" cy="59" r="1" style="stroke:black;stroke-width:1;fill: black;"/>

    <!--        second resistor-->
    <line x1="70" y1="8" x2="70" y2="20" stroke="currentColor" stroke-width="0.8"/>
    <line x1="70" y1="45" x2="70" y2="60" stroke="currentColor" stroke-width="0.8"/>
    <circle cx="70" cy="8" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="70" cy="59" r="1" style="stroke:black;stroke-width:1;fill:black;"/>

    <line x1="51.5" y1="20" x2="51.5" y2="60" style="stroke:black;stroke-width:1;fill: black;"/>



    <use href="#capacitor" transform="translate(-2,-17.5) scale(0.5,0.5)"/>
    <use href="#capacitor" transform="translate(60,-17) scale(0.5,0.5)"/>

    <!-- Masse-Leitung -->
    <line x1="5" y1="59" x2="92" y2="59" stroke="currentColor" stroke-width="0.7"/>
    <circle cx="5" cy="59" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="51.5" cy="59" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="91" cy="59" r="1" style="stroke:black;stroke-width:1;fill: black;"/>

    <!-- obere Versorgung -->
    <line x1="60" y1="7.5" x2="80" y2="7.5" stroke="currentColor" stroke-width="0.7"/>
    <circle cx="5" cy="8" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="91" cy="8" r="1" style="stroke:black;stroke-width:1;fill: black;"/>


    <!-- Beschriftung -->


    <text x="15" y="40" font-size="4">
        <tspan>R</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">G</tspan>
    </text>
    <text x="75" y="40" font-size="4">
        <tspan>R</tspan>
        <tspan dx="-1" dy="2" font-size="3" font-family="arial">L</tspan>
    </text>


</svg>
