<svg width="160" height="160" viewBox="0 0 150 110" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== PNP Symbol (oben links) ===== -->
  <text x="10" y="12" font-size="6">PNP</text>
  <g id="pnp_symbol" transform="translate(25,20)">
    <!-- Base lead out to the left -->
    <line x1="-18" y1="20" x2="0" y2="20" stroke="black" stroke-width="1"/>
    <circle cx="-18" cy="20" r="1.5" fill="white" stroke="black" stroke-width="1"/>
    <text x="-22" y="22" font-size="5" text-anchor="end">B</text>

    <!-- Base line -->
    <line x1="0" y1="0" x2="0" y2="40" stroke="black" stroke-width="1"/>

    <!-- Collector -->
    <line x1="0" y1="10" x2="25" y2="0" stroke="black" stroke-width="1"/>
    <line x1="25" y1="0" x2="40" y2="0" stroke="black" stroke-width="1"/>
    <text x="44" y="3" font-size="5">C</text>

    <!-- Emitter -->
    <line x1="0" y1="30" x2="25" y2="40" stroke="black" stroke-width="1"/>
    <line x1="25" y1="40" x2="40" y2="40" stroke="black" stroke-width="1"/>
    <text x="44" y="43" font-size="5">E</text>

    <!-- Arrow (PNP: arrow IN to base, bigger) -->
    <!-- placed on emitter diagonal, pointing toward base -->
    <polygon points="20,36 28,40 20,44" fill="black"/>
  </g>

  <!-- ===== NPN Symbol (unten links) ===== -->
  <text x="10" y="65" font-size="6">NPN</text>
  <g id="npn_symbol" transform="translate(25,75)">
    <!-- Base lead out to the left -->
    <line x1="-18" y1="20" x2="0" y2="20" stroke="black" stroke-width="1"/>
    <circle cx="-18" cy="20" r="1.5" fill="white" stroke="black" stroke-width="1"/>
    <text x="-22" y="22" font-size="5" text-anchor="end">B</text>

    <!-- Base line -->
    <line x1="0" y1="0" x2="0" y2="40" stroke="black" stroke-width="1"/>

    <!-- Collector -->
    <line x1="0" y1="10" x2="25" y2="0" stroke="black" stroke-width="1"/>
    <line x1="25" y1="0" x2="40" y2="0" stroke="black" stroke-width="1"/>
    <text x="44" y="3" font-size="5">C</text>

    <!-- Emitter -->
    <line x1="0" y1="30" x2="25" y2="40" stroke="black" stroke-width="1"/>
    <line x1="25" y1="40" x2="40" y2="40" stroke="black" stroke-width="1"/>
    <text x="44" y="43" font-size="5">E</text>

    <!-- Arrow (NPN: arrow OUT from base, bigger) -->
    <!-- placed on emitter diagonal, pointing outward (away from base) -->
    <polygon points="28,36 20,40 28,44" fill="black"/>
  </g>

  <!-- ===== PNP cross-section (rechts unten) ===== -->
  <g id="pnp_layers" transform="translate(84,16)">
    <text x="22" y="-6" font-size="5" text-anchor="middle">PNP (p–n–p)</text>
    <rect x="0"  y="10" width="3" height="32" fill="black"/>
    <rect x="39" y="10" width="3" height="32" fill="black"/>
    <line x1="-8" y1="26" x2="0"  y2="26" stroke="black" stroke-width="1"/>
    <line x1="42" y1="26" x2="46" y2="26" stroke="black" stroke-width="1"/>
    <rect x="3"  y="10" width="12" height="32" fill="salmon"    stroke="black"/>
    <rect x="15" y="10" width="12" height="32" fill="lightblue" stroke="black"/>
    <rect x="27" y="10" width="12" height="32" fill="salmon"    stroke="black"/>
    <line x1="15" y1="10" x2="15" y2="42" stroke="black" stroke-dasharray="2,2"/>
    <line x1="27" y1="10" x2="27" y2="42" stroke="black" stroke-dasharray="2,2"/>
    <rect x="19" y="42" width="8" height="3" fill="black"/>
    <line x1="23" y1="45" x2="23" y2="54" stroke="black" stroke-width="1"/>
    <text x="-8" y="24" font-size="5" text-anchor="end">E</text>
    <text x="46"  y="24" font-size="5">C</text>
    <text x="23"  y="58" font-size="5" text-anchor="middle">B</text>
    <text x="9"  y="28" font-size="5" text-anchor="middle">p</text>
    <text x="21" y="28" font-size="5" text-anchor="middle">n</text>
    <text x="33" y="28" font-size="5" text-anchor="middle">p</text>
  </g>
      <!-- ===== NPN cross-section (rechts oben) ===== -->
  <g id="npn_layers" transform="translate(84,70)">
    <text x="22" y="-6" font-size="5" text-anchor="middle">NPN (n–p–n)</text>
    <rect x="0"  y="10" width="3" height="32" fill="black"/>
    <rect x="39" y="10" width="3" height="32" fill="black"/>
    <line x1="-8" y1="26" x2="0"  y2="26" stroke="black" stroke-width="1"/>
    <line x1="42" y1="26" x2="46" y2="26" stroke="black" stroke-width="1"/>
    <rect x="3"  y="10" width="12" height="32" fill="lightblue" stroke="black"/>
    <rect x="15" y="10" width="12" height="32" fill="salmon"    stroke="black"/>
    <rect x="27" y="10" width="12" height="32" fill="lightblue" stroke="black"/>
    <line x1="15" y1="10" x2="15" y2="42" stroke="black" stroke-dasharray="2,2"/>
    <line x1="27" y1="10" x2="27" y2="42" stroke="black" stroke-dasharray="2,2"/>
    <rect x="19" y="42" width="8" height="3" fill="black"/>
    <line x1="23" y1="45" x2="23" y2="54" stroke="black" stroke-width="1"/>
    <text x="-8" y="24" font-size="5" text-anchor="end">E</text>
    <text x="46"  y="24" font-size="5">C</text>
    <text x="23"  y="58" font-size="5" text-anchor="middle">B</text>
    <text x="9"  y="28" font-size="5" text-anchor="middle">n</text>
    <text x="21" y="28" font-size="5" text-anchor="middle">p</text>
    <text x="33" y="28" font-size="5" text-anchor="middle">n</text>
  </g>

</svg>
