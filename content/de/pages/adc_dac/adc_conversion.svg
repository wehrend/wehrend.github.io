<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <style>
      .title { font: 700 26px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill:#111; }
      .label { font: 600 18px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill:#111; }
      .small { font: 500 14px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill:#333; }
      .axis { stroke:#222; stroke-width:3; }
      .grid { stroke:#d7d7d7; stroke-width:1; }
      .analog { stroke:#1f5cff; stroke-width:5; fill:none; }
      .sampleLine { stroke:#d22; stroke-width:2; stroke-dasharray:6 6; opacity:0.9; }
      .sampleDot { fill:#d22; stroke:#fff; stroke-width:2; }
      .qLevel { stroke:#777; stroke-width:2; opacity:0.8; }
      .qStair { stroke:#f2b400; stroke-width:6; fill:none; stroke-linejoin:round; stroke-linecap:round; }
      .qSquare { fill:#f2b400; stroke:#111; stroke-width:2; }
      .arrow { stroke:#222; stroke-width:3; fill:none; marker-end:url(#mArrow); }
    </style>

    <marker id="mArrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#222"></path>
    </marker>

    <!-- clip plotting area -->
    <clipPath id="clipPlot">
      <rect x="90" y="70" width="820" height="470" rx="8"></rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="650" fill="#fff"></rect>

  <!-- Titles -->
  <text x="90" y="48" class="title">Analoges Signal → Abtastung (Sampling) → Quantisierung</text>

  <!-- Plot area border (subtle) -->
  <rect x="90" y="70" width="820" height="470" rx="10" fill="#fff" stroke="#eee" stroke-width="2"></rect>

  <!-- Grid + Quantization levels -->
  <!-- Horizontal grid / quantization levels -->
  <g>
    <!-- 9 levels -->
    <line x1="90" y1="110" x2="910" y2="110" class="grid"></line>
    <line x1="90" y1="160" x2="910" y2="160" class="grid"></line>
    <line x1="90" y1="210" x2="910" y2="210" class="grid"></line>
    <line x1="90" y1="260" x2="910" y2="260" class="grid"></line>
    <line x1="90" y1="310" x2="910" y2="310" class="grid"></line>
    <line x1="90" y1="360" x2="910" y2="360" class="grid"></line>
    <line x1="90" y1="410" x2="910" y2="410" class="grid"></line>
    <line x1="90" y1="460" x2="910" y2="460" class="grid"></line>
    <line x1="90" y1="510" x2="910" y2="510" class="grid"></line>
  </g>

  <!-- Axes -->
  <line x1="120" y1="540" x2="900" y2="540" class="axis"></line>
  <line x1="120" y1="540" x2="120" y2="95" class="axis"></line>
  <path d="M900 540 L915 540" class="axis"></path>
  <path d="M120 95 L120 80" class="axis"></path>

  <!-- Axis labels -->
  <text x="840" y="590" class="label">Zeit t</text>
  <text x="40" y="120" class="label" transform="rotate(-90 40 120)">Amplitude</text>

  <!-- Plot content clipped -->
  <g clip-path="url(#clipPlot)">
    <!-- Analog sine-like signal -->
    <path class="analog" d="M 120 330
             C 170 230, 230 140, 290 180
             C 350 220, 390 310, 450 360
             C 520 420, 610 410, 660 320
             C 710 240, 780 170, 850 210
             C 890 235, 905 260, 910 265"></path>

    <!-- Sampling instants (vertical dashed lines) -->
    <g>
      <line x1="170" y1="540" x2="170" y2="110" class="sampleLine"></line>
      <line x1="230" y1="540" x2="230" y2="110" class="sampleLine"></line>
      <line x1="290" y1="540" x2="290" y2="110" class="sampleLine"></line>
      <line x1="350" y1="540" x2="350" y2="110" class="sampleLine"></line>
      <line x1="410" y1="540" x2="410" y2="110" class="sampleLine"></line>
      <line x1="470" y1="540" x2="470" y2="110" class="sampleLine"></line>
      <line x1="530" y1="540" x2="530" y2="110" class="sampleLine"></line>
      <line x1="590" y1="540" x2="590" y2="110" class="sampleLine"></line>
      <line x1="650" y1="540" x2="650" y2="110" class="sampleLine"></line>
      <line x1="710" y1="540" x2="710" y2="110" class="sampleLine"></line>
      <line x1="770" y1="540" x2="770" y2="110" class="sampleLine"></line>
      <line x1="830" y1="540" x2="830" y2="110" class="sampleLine"></line>
    </g>

    <!-- Sample dots on analog curve (precomputed positions) -->
    <g>
      <circle cx="170" cy="246" r="8" class="sampleDot"></circle>
      <circle cx="230" cy="172" r="8" class="sampleDot"></circle>
      <circle cx="290" cy="182" r="8" class="sampleDot"></circle>
      <circle cx="350" cy="246" r="8" class="sampleDot"></circle>
      <circle cx="410" cy="326" r="8" class="sampleDot"></circle>
      <circle cx="470" cy="378" r="8" class="sampleDot"></circle>
      <circle cx="530" cy="413" r="8" class="sampleDot"></circle>
      <circle cx="590" cy="405" r="8" class="sampleDot"></circle>
      <circle cx="650" cy="338" r="8" class="sampleDot"></circle>
      <circle cx="710" cy="255" r="8" class="sampleDot"></circle>
      <circle cx="770" cy="200" r="8" class="sampleDot"></circle>
      <circle cx="830" cy="205" r="8" class="sampleDot"></circle>
    </g>

    <!-- Quantized staircase (snap sample values to nearest level) -->
    <!-- Levels used: y=160,210,260,310,360,410,460 -->
    <path class="qStair" d="M 170 260 L 230 260
             L 230 160 L 290 160
             L 290 210 L 350 210
             L 350 260 L 410 260
             L 410 310 L 470 310
             L 470 360 L 530 360
             L 530 410 L 590 410
             L 590 410 L 650 410
             L 650 360 L 710 360
             L 710 260 L 770 260
             L 770 210 L 830 210
             L 830 210 L 890 210"></path>

    <!-- Quantized sample markers (squares on the staircase at sampling instants) -->
    <g>
      <rect x="162" y="252" width="16" height="16" class="qSquare"></rect>
      <rect x="222" y="152" width="16" height="16" class="qSquare"></rect>
      <rect x="282" y="202" width="16" height="16" class="qSquare"></rect>
      <rect x="342" y="252" width="16" height="16" class="qSquare"></rect>
      <rect x="402" y="302" width="16" height="16" class="qSquare"></rect>
      <rect x="462" y="352" width="16" height="16" class="qSquare"></rect>
      <rect x="522" y="402" width="16" height="16" class="qSquare"></rect>
      <rect x="582" y="402" width="16" height="16" class="qSquare"></rect>
      <rect x="642" y="352" width="16" height="16" class="qSquare"></rect>
      <rect x="702" y="252" width="16" height="16" class="qSquare"></rect>
      <rect x="762" y="202" width="16" height="16" class="qSquare"></rect>
      <rect x="822" y="202" width="16" height="16" class="qSquare"></rect>
    </g>
  </g>

  <!-- Right-side explanation panel -->
  <g transform="translate(940,90)">
    <text x="0" y="0" class="label">Legende</text>

    <line x1="0" y1="35" x2="60" y2="35" class="analog"></line>
    <text x="75" y="41" class="small">Analoges (kontinuierliches) Signal</text>

    <line x1="0" y1="75" x2="60" y2="75" class="sampleLine"></line>
    <circle cx="30" cy="75" r="6" class="sampleDot"></circle>
    <text x="75" y="81" class="small">Abtastzeitpunkte (Samples)</text>

    <path d="M0 115 L60 115" class="qStair"></path>
    <rect x="22" y="107" width="16" height="16" class="qSquare"></rect>
    <text x="75" y="121" class="small">Quantisierte Werte (Stufen)</text>

    <text x="0" y="170" class="label">Erklärung</text>
    <text x="0" y="200" class="small">1) Sampling: Messung in festen Zeitabständen.</text>
    <text x="0" y="225" class="small">2) Quantisierung: Rundung auf diskrete Amplitudenstufen.</text>
  </g>

  <!-- Callouts / arrows -->
  <g>
    <path class="arrow" d="M 960 310 C 880 310, 850 290, 780 250"></path>
    <text x="945" y="300" class="small">Sampling</text>

    <path class="arrow" d="M 960 420 C 880 420, 840 430, 720 410"></path>
    <text x="935" y="412" class="small">Quantisierung</text>

    <text x="140" y="105" class="small">Quantisierungs-Levels</text>
  </g>

</svg>
