<svg width="120" height="100" viewBox="0 0 100 100"
     xmlns="http://www.w3.org/2000/svg">

    <!-- Marker außerhalb des Symbols (robuster) -->
    <defs>
        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3"
                orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L6,3 z" fill="black"/>
        </marker>
    </defs>
<symbol id="fet_classic">
        <line x1="75" y1="62" x2="75" y2="66" style="stroke:black;stroke-width:1;fill:none;"/>
        <line x1="75" y1="68" x2="75" y2="72" style="stroke:black;stroke-width:1;fill:none;"/>
        <line x1="75" y1="74" x2="75" y2="78" style="stroke:black;stroke-width:1;fill:none;"/>
        <!--Source-->
<!--        <text x="81" y="85" font-size="5">S</text>-->
        <polyline points="75,76 80,76 80,85" style="stroke:black;stroke-width:1;fill:none;"/>
        <polyline points="75,70 80,70 80,85" style="stroke:black;stroke-width:1;fill:none;"/>
        <g id="arrow" rotate="90">
            <polygon points="78,69 76,70 78,71 78,69" stroke="black"/>
        </g>
        <!--Gate-->
<!--        <text x="58" y="78" font-size="5">G</text>-->
        <line x1="62" y1="76" x2="73" y2="76" style="stroke:black;stroke-width:1;fill:none;stroke-linecap:round"/>
        <line x1="73" y1="63" x2="73" y2="76" style="stroke:black;stroke-width:1;fill:none;"/>
        <!--Drain-->
<!--        <text x="81" y="57" font-size="5">D</text>-->
        <polyline points="75,64 80,64 80,53" style="stroke:black;stroke-width:1;fill:none;"/>
        <!--Circle-->
        <circle cx="76" cy="70" r="11" style="stroke:black;stroke-width:1;fill:none;"/>
    </symbol>
    <symbol id="capacitor" viewBox="0 0 200 60">
        <!-- Leitungen -->
        <line x1="40" y1="30" x2="80" y2="30" stroke="black" stroke-width="4" stroke-linecap="round"/>
        <line x1="90" y1="30" x2="160" y2="30" stroke="black" stroke-width="4" stroke-linecap="round"/>
        <!-- capacitor -->
        <line x1="80" y1="10" x2="80" y2="49" stroke="black" stroke-width="4"/>
        <line x1="87" y1="10" x2="87" y2="49" stroke="black" stroke-width="4"/>
    </symbol>

    <!-- IEC (EU) Rechteck -->
    <symbol id="resistor" viewBox="0 0 200 60">
        <!-- Leitungen -->
        <line x1="16.5" y1="30" x2="60" y2="31" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <line x1="120" y1="30" x2="160" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- Widerstandskörper -->
        <rect x="60" y="20" width="60" height="20" fill="none" stroke="currentColor" stroke-width="4"/>
    </symbol>

    <!-- power line-->
    <line x1="51.5" y1="2" x2="92" y2="2" stroke="currentColor" stroke-width="0.7"/>
    <use href="#fet_classic" transform="translate(-28, -23.5) "/>
    <g transform="translate(60,13) rotate(90)">
        <use href="#resistor" transform="translate(38,10) scale(0.5,0.5)"/>
        <use href="#resistor" transform="translate(-15,-17) scale(0.5,0.5)"/>
    </g>

    <!-- ground line-->
    <line x1="0" y1="86" x2="92" y2="86" stroke="currentColor" stroke-width="0.7"/>
    <circle cx="0" cy="86" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="91" cy="86" r="1" style="stroke:black;stroke-width:1;fill: black;"/>

    <line x1="52" y1="60" x2="52" y2="86" stroke="currentColor" stroke-width="0.8"/>
    <circle cx="25" cy="52.5" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <line x1="25" y1="52" x2="25" y2="56" stroke="currentColor" stroke-width="0.7"/>

    <!-- base line (EINGANG) — ersetzt durch Kondensator -->
    <!-- ALT: <line x1="12" y1="52.5" x2="30" y2="52.5" .../> -->
    <use href="#capacitor" transform="translate(-10,27.5) scale(0.5)"/>
    <line x1="25" y1="52.5" x2="35" y2="52.5" stroke="currentColor" stroke-width="0.8"/>
    <circle cx="0" cy="52.5" r="1" style="stroke:black;stroke-width:1;fill:black;"/>

    <!-- collector line (AUSGANG) — Leitung verkürzt + Kondensator eingefügt -->
    <!-- ALT: <line x1="52" y1="40" x2="90" y2="40" .../> -->
    <!--  <line x1="52" y1="40" x2="72" y2="40" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>-->
    <use href="#capacitor" transform="translate(92.5,6) scale(-0.5,0.5)"/>
     <circle cx="52" cy="31" r="1" style="stroke:black;stroke-width:1;fill:black;"/>
    <circle cx="91" cy="31" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <line x1="80" y1="31" x2="90" y2="31" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="25" cy="91" r="1" style="stroke:black;stroke-width:1;fill:black;"/>
        <circle cx="91" cy="2" r="1" style="stroke:black;stroke-width:1;fill:black;"/>
<!--    <text x="32" y="50" fill="blue" font-size="6">B</text>-->
<!--    <text x="85" y="45" fill="blue" font-size="6">C</text>-->
<!--    <text x="45" y="75" fill="blue" font-size="6">E</text>-->
    <text x="92.5" y="37.5" font-size="6">out</text>
        <text x="57" y="25" font-size="6">
        <tspan>R</tspan>
        <tspan dx="-1" dy="2" font-size="5" font-family="arial">L</tspan>
        </text>
    <text x="92.5" y="37.5" font-size="6">out</text>
        <text x="30" y="75" font-size="6">
        <tspan>R</tspan>
        <tspan dx="-1" dy="2" font-size="5" font-family="arial">G</tspan>
        </text>

        <text x="28" y="93" font-size="6">
        <tspan>-U</tspan>
        <tspan dx="-1" dy="2" font-size="5" font-family="arial">G</tspan>
        </text>

</svg>
