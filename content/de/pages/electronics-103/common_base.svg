<svg width="120" height="100" viewBox="0 0 100 100"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Marker außerhalb des Symbols (robuster) -->
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="black"/>
    </marker>
  </defs>

  <symbol id="npn">
    <g transform="translate(0 15.5)">
      <g id="npn_classic">
        <polyline points="73,20 80,15 80,05" style="stroke:black;stroke-width:1;fill:none;"/>
        <!-- Basis -->
        <line x1="58" y1="25" x2="73" y2="25" style="stroke:black;stroke-width:1;fill:none;stroke-linecap:round"/>
        <line x1="73" y1="18" x2="73" y2="31" style="stroke:black;stroke-width:1;fill:none;"/>
        <!-- Emitter -->
        <polyline points="73,28 80,35 80,42" style="stroke:black;stroke-width:1;fill:none;"/>
        <!-- Pfeil -->
        <line x1="77" y1="34" x2="80" y2="37" style="stroke:black;stroke-width:1;marker-end:url(#arrowhead)"/>
        <!-- Kreis -->
        <circle cx="76" cy="25" r="11" style="stroke:black;stroke-width:1;fill:none;"/>
      </g>
    </g>
  </symbol>
    <use href="#npn" transform="translate(-30) rotate(-90 76 40.5)"/>



    <line x1="12" y1="71" x2="92" y2="71" stroke="currentColor" stroke-width="0.7" />
    <circle cx="12" cy="71" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="91" cy="71" r="1" style="stroke:black;stroke-width:1;fill: black;"/>

     <line x1="46" y1="50" x2="46" y2="71" stroke="currentColor" stroke-width="0.7" />

    <line x1="12" y1="36.5" x2="30" y2="36.5" stroke="currentColor" stroke-width="0.7" />
    <line x1="60" y1="36.5" x2="90" y2="36.5" stroke="currentColor" stroke-width="0.7" />

    <circle cx="12" cy="36.5" r="1" style="stroke:black;stroke-width:1;fill: black;"/>
    <circle cx="91" cy="36.5" r="1" style="stroke:black;stroke-width:1;fill: black;"/>

    <text x="10" y="32" fill="blue" font-size="6">E</text>
    <text x="85" y="32" fill="blue" font-size="6">C</text>
    <text x="35" y="55" fill="blue" font-size="6">B</text>
    <text x="25" y="77"  font-size="6">Common base</text>

</svg>

