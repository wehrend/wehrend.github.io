<svg width="205px"
     height="64px"
     viewBox="0.0 0.0 205.00 64.00"
     xmlns="http://www.w3.org/2000/svg" version="1.1">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="black" />
        </marker>
        <g id="array">
        <rect x="5" y="5" width="40" height="6" style="fill:none;stroke:black;stroke-width:0.6px;"/>
        <line x1="10" y1="5" x2="10" y2="11" style="fill:none;stroke:black;stroke-width:0.6px;"/>
        <line x1="15" y1="5" x2="15" y2="11" style="fill:none;stroke:black;stroke-width:0.6px;"/>
        <line x1="20" y1="5" x2="20" y2="11" style="fill:none;stroke:black;stroke-width:0.6px;"/>
        <line x1="25" y1="5" x2="25" y2="11" style="fill:none;stroke:black;stroke-width:0.6px;"/>
        <line x1="30" y1="5" x2="30" y2="11" style="fill:none;stroke:black;stroke-width:0.6px;"/>
        <line x1="35" y1="5" x2="35" y2="11" style="fill:none;stroke:black;stroke-width:0.6px;"/>
        <line x1="40" y1="5" x2="40" y2="11" style="fill:none;stroke:black;stroke-width:0.6px;"/>
    </g>
    </defs>
    <text x="20" y="5" font-size="4">Multiplication by 2 ( x &lt;&lt; 1 )</text>
    <text x="130" y="5" font-size="4">Division by 2 ( x &gt;&gt;&gt; 1 )</text>
    <g transform="translate(0,10)">
    <!-- left half: left shift, no overflow -->
    <text x="20" y="3" font-size="2.4"  style="fill:blue;">MSB</text>
    <text x="55" y="3" font-size="2.4"  style="fill:blue;">LSB</text>
    <use x="15" y="0" href="#array"/>
    <line x1="27.5" y1="11" x2="24" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="32.5" y1="11" x2="29" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="37.5" y1="11" x2="34" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="42.5" y1="11" x2="39" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="47.5" y1="11" x2="44" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="52.5" y1="11" x2="49" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="57.5" y1="11" x2="54" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <rect x="70" y="25" width="5" height="6" style="fill:none;stroke:black;stroke-width:0.5px;"/>
    <line x1="70" y1="27.5" x2="65" y2="27.5" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <use x="15" y="20" href="#array"/>
    <text x="21" y="9" font-size="4">0</text>
    <text x="26" y="9" font-size="4">0</text>
    <text x="31" y="9" font-size="4">1</text>
    <text x="36" y="9" font-size="4">0</text>
    <text x="41" y="9" font-size="4">1</text>
    <text x="46" y="9" font-size="4">1</text>
    <text x="51" y="9" font-size="4">0</text>
    <text x="56" y="9" font-size="4">1</text>
    <text x="21" y="29" font-size="4">0</text>
    <text x="26" y="29" font-size="4">1</text>
    <text x="31" y="29" font-size="4">0</text>
    <text x="36" y="29" font-size="4">1</text>
    <text x="41" y="29" font-size="4">1</text>
    <text x="46" y="29" font-size="4">0</text>
    <text x="51" y="29" font-size="4">1</text>
    <text x="56" y="29" font-size="4">0</text>
    <text x="71" y="29" font-size="4">0</text>

    <text x="20" y="37" font-size="4">arithmetic left shift</text>
    <text x="20" y="42" font-size="4" fill="red">equals the logical left shift operation</text>
    <text x="20" y="47" font-size="3.4" fill="#555">45 · 2 = 90</text>

    <!-- right half: arithmetic right shift of a negative number -->
    <text x="130" y="3" font-size="2.4"  style="fill:blue;">MSB</text>
    <text x="165" y="3" font-size="2.4"  style="fill:blue;">LSB</text>
    <use x="125" y="0" href="#array"/>
    <line x1="132.5" y1="11" x2="132.5" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="132.5" y1="11" x2="136" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="137.5" y1="11" x2="141" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="142.5" y1="11" x2="146" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="147.5" y1="11" x2="151" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="152.5" y1="11" x2="156" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="157.5" y1="11" x2="161" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <line x1="162.5" y1="11" x2="166" y2="20" style="fill:none;stroke:black;stroke-width:0.5px;" marker-end="url(#arrow)"/>
    <use x="125" y="20" href="#array"/>
    <text x="131" y="9" font-size="4">1</text>
    <text x="136" y="9" font-size="4">1</text>
    <text x="141" y="9" font-size="4">0</text>
    <text x="146" y="9" font-size="4">1</text>
    <text x="151" y="9" font-size="4">1</text>
    <text x="156" y="9" font-size="4">0</text>
    <text x="161" y="9" font-size="4">0</text>
    <text x="166" y="9" font-size="4">1</text>
    <text x="131" y="29" font-size="4">1</text>
    <text x="136" y="29" font-size="4">1</text>
    <text x="141" y="29" font-size="4">1</text>
    <text x="146" y="29" font-size="4">0</text>
    <text x="151" y="29" font-size="4">1</text>
    <text x="156" y="29" font-size="4">1</text>
    <text x="161" y="29" font-size="4">0</text>
    <text x="166" y="29" font-size="4">0</text>

    <text x="130" y="37" font-size="4">arithmetic right shift</text>
    <text x="130" y="42" font-size="4" fill="red">the MSB (the sign bit) stays in place</text>
    <text x="130" y="46" font-size="4" fill="red">and is copied one position to the right</text>
    <text x="130" y="51" font-size="3.4" fill="#555">-39 / 2 = -19.5, rounded down to -20</text>
    </g>
</svg>
