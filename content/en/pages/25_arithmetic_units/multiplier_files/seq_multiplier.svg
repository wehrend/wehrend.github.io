<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" font-family="Liberation Serif, Times New Roman, serif">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="black"/></marker></defs>
<text x="30" y="30" font-size="17" text-anchor="start" fill="black" font-weight="bold">Sequential shift-and-add multiplier (seq_multiplier.v)</text>
<text x="30" y="52" font-size="13" text-anchor="start" fill="#333" >one adder, one bit of the multiplier per clock cycle, N clock cycles in total</text>
<rect x="80" y="76" width="220" height="40" fill="#fdf6e3" stroke="black" stroke-width="1.4" />
<text x="190" y="94" font-size="15" text-anchor="middle" fill="black" >mcand (N bit)</text>
<text x="190" y="110" font-size="11" text-anchor="middle" fill="#777" >multiplicand, constant</text>
<rect x="140" y="156" width="100" height="40" fill="#f6f6f6" stroke="black" stroke-width="1.4" />
<text x="190" y="174" font-size="15" text-anchor="middle" fill="black" >AND</text>
<text x="190" y="189" font-size="11" text-anchor="middle" fill="#777" >prod[0] ? mcand : 0</text>
<line x1="190" y1="116" x2="190" y2="156" stroke="black" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M120,236 L260,236 L300,296 L80,296 Z" fill="#eef4fb" stroke="#1f5fbf" stroke-width="1.4"/>
<text x="190" y="262" font-size="15" text-anchor="middle" fill="black" >adder (N+1 bit)</text>
<text x="190" y="280" font-size="11" text-anchor="middle" fill="#777" >upper half + AND output</text>
<line x1="190" y1="196" x2="190" y2="236" stroke="black" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="340" y="246" width="210" height="44" fill="white" stroke="black" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="445" y="266" font-size="14" text-anchor="middle" fill="black" font-family="DejaVu Sans Mono, monospace">{sum, lower} &gt;&gt; 1</text>
<text x="445" y="282" font-size="11" text-anchor="middle" fill="#777" >shift right by one bit</text>
<path d="M282,268 H340" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M445,290 V360" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="80" y="360" width="300.0" height="44" fill="#eaf6ee" stroke="#1a8a3a" stroke-width="1.4" />
<rect x="380.0" y="360" width="300.0" height="44" fill="#f6f6f6" stroke="black" stroke-width="1.4" />
<text x="230.0" y="380" font-size="14" text-anchor="middle" fill="black" >upper half: running sum</text>
<text x="230.0" y="397" font-size="11" text-anchor="middle" fill="#777" font-family="DejaVu Sans Mono, monospace">prod[2N:N]</text>
<text x="530.0" y="380" font-size="14" text-anchor="middle" fill="black" >lower half: remaining multiplier bits</text>
<text x="530.0" y="397" font-size="11" text-anchor="middle" fill="#777" font-family="DejaVu Sans Mono, monospace">prod[N-1:0]</text>
<text x="380.0" y="424" font-size="14" text-anchor="middle" fill="black" font-weight="bold">product register prod (2N+1 bit)</text>
<path d="M120,360 V320 H100 V296" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="126" y="340" font-size="11" text-anchor="start" fill="#777" >upper half</text>
<path d="M570.0,360 V320 H530 V290" fill="none" stroke="#777" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="576.0" y="340" font-size="11" text-anchor="start" fill="#777" >lower half</text>
<path d="M666,360 V176 H240" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="674" y="230" font-size="13" text-anchor="start" fill="#c0392b" >prod[0]</text>
<text x="674" y="246" font-size="11" text-anchor="start" fill="#c0392b" >lowest bit:</text>
<text x="674" y="260" font-size="11" text-anchor="start" fill="#c0392b" >add or not?</text>
<rect x="470" y="70" width="230" height="86" fill="#fbeeee" stroke="#c0392b" stroke-width="1.4" />
<text x="585" y="90" font-size="15" text-anchor="middle" fill="black" font-weight="bold">control</text>
<text x="585" y="110" font-size="11.5" text-anchor="middle" fill="black" >start: mcand = a, prod = {0, b}, count = N</text>
<text x="585" y="126" font-size="11.5" text-anchor="middle" fill="black" >every clock: add, shift, count − 1</text>
<text x="585" y="142" font-size="11.5" text-anchor="middle" fill="black" >count reaches 0 → done = 1</text>
<text x="30" y="464" font-size="14" text-anchor="start" fill="black" font-weight="bold">Every clock cycle:</text>
<text x="30" y="486" font-size="14" text-anchor="start" fill="black" >1.  If the lowest bit prod[0] is 1, the multiplicand is added to the upper half.</text>
<text x="30" y="508" font-size="14" text-anchor="start" fill="black" >2.  Then the whole register is shifted right by one bit: the next multiplier bit becomes prod[0],</text>
<text x="30" y="528" font-size="14" text-anchor="start" fill="black" >     and the lowest finished product bit moves into the lower half.</text>
<text x="30" y="550" font-size="14" text-anchor="start" fill="black" >After N cycles, the register holds the complete 2N-bit product (13 · 11 = 143 after 8 cycles).</text>
</svg>
