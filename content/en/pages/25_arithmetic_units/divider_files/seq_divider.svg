<svg xmlns="http://www.w3.org/2000/svg" width="860" height="598" viewBox="0 0 860 598" font-family="Liberation Serif, Times New Roman, serif">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="black"/></marker></defs>
<text x="30" y="30" font-size="17" text-anchor="start" fill="black" font-weight="bold">Sequential restoring divider (seq_divider.v)</text>
<text x="30" y="52" font-size="13" text-anchor="start" fill="#333" >one subtractor, one quotient bit per clock cycle, N clock cycles in total</text>
<rect x="80" y="76" width="260" height="44" fill="#eaf6ee" stroke="#1a8a3a" stroke-width="1.4" />
<text x="210" y="96" font-size="14" text-anchor="middle" fill="black" >remainder (N bit)</text>
<text x="210" y="113" font-size="11" text-anchor="middle" fill="#777" >starts at 0</text>
<rect x="340" y="76" width="260" height="44" fill="#f6f6f6" stroke="black" stroke-width="1.4" />
<text x="470" y="96" font-size="14" text-anchor="middle" fill="black" >quotient (N bit)</text>
<text x="470" y="113" font-size="11" text-anchor="middle" fill="#777" >starts with the dividend</text>
<rect x="640" y="76" width="180" height="44" fill="#fdf6e3" stroke="black" stroke-width="1.4" />
<text x="730" y="96" font-size="14" text-anchor="middle" fill="black" >dsor (N bit)</text>
<text x="730" y="113" font-size="11" text-anchor="middle" fill="#777" >divisor, constant</text>
<rect x="80" y="150" width="320" height="44" fill="white" stroke="black" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="240" y="169" font-size="13" text-anchor="middle" fill="black" font-family="DejaVu Sans Mono, monospace">shifted = {remainder, quotient[N-1]}</text>
<text x="240" y="186" font-size="11" text-anchor="middle" fill="#777" >the next dividend bit moves into the remainder</text>
<line x1="200" y1="120" x2="200" y2="150" stroke="black" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="360" y1="120" x2="360" y2="150" stroke="#777" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="366" y="140" font-size="11" text-anchor="start" fill="#777" >MSB of quotient</text>
<path d="M220,232 L440,232 L470,292 L190,292 Z" fill="#eef4fb" stroke="#1f5fbf" stroke-width="1.4"/>
<text x="330" y="257" font-size="15" text-anchor="middle" fill="black" >subtractor (N+1 bit)</text>
<text x="330" y="278" font-size="11" text-anchor="middle" fill="#777" font-family="DejaVu Sans Mono, monospace">diff = shifted − dsor</text>
<line x1="300" y1="194" x2="300" y2="232" stroke="black" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M730,120 V262 H457" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M90,350 L340,350 L320,380 L110,380 Z" fill="white" stroke="black" stroke-width="1.4"/>
<text x="215" y="370" font-size="13" text-anchor="middle" fill="black" >MUX</text>
<text x="122" y="362" font-size="10" text-anchor="middle" fill="black" >0</text>
<text x="300" y="362" font-size="10" text-anchor="middle" fill="black" >1</text>
<line x1="300" y1="292" x2="300" y2="350" stroke="black" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="306" y="320" font-size="11" text-anchor="start" fill="#777" >diff</text>
<path d="M120,194 V350" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="126" y="300" font-size="11" text-anchor="start" fill="#777" >shifted</text>
<path d="M462,282 H500 V365 H332" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M500,282 H600 V372 H620" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="506" y="274" font-size="12" text-anchor="start" fill="#c0392b" >fits = no borrow (diff ≥ 0)</text>
<path d="M215,380 V405 H40 V98 H80" fill="none" stroke="#1a8a3a" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="48" y="420" font-size="12" text-anchor="start" fill="#1a8a3a" font-family="DejaVu Sans Mono, monospace">new remainder = fits ? diff : shifted</text>
<rect x="620" y="350" width="200" height="44" fill="white" stroke="black" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="720" y="369" font-size="12" text-anchor="middle" fill="black" font-family="DejaVu Sans Mono, monospace">{quotient[N-2:0], fits}</text>
<text x="720" y="386" font-size="11" text-anchor="middle" fill="#777" >shift left, fits becomes bit 0</text>
<path d="M660,350 V310 H580 V120" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="586" y="330" font-size="11" text-anchor="start" fill="#777" >new quotient</text>
<text x="30" y="470" font-size="14" text-anchor="start" fill="black" font-weight="bold">Every clock cycle:</text>
<text x="30" y="492" font-size="14" text-anchor="start" fill="black" >1.  The next bit of the dividend (the MSB of the quotient register) is shifted into the remainder.</text>
<text x="30" y="514" font-size="14" text-anchor="start" fill="black" >2.  The divisor is subtracted. If there is no borrow, it fits: the difference becomes the new remainder.</text>
<text x="30" y="534" font-size="14" text-anchor="start" fill="black" >     Otherwise the old value is kept, it is “restored”.</text>
<text x="30" y="556" font-size="14" text-anchor="start" fill="black" >3.  The quotient register shifts left, and fits (1 or 0) becomes its new lowest bit.</text>
<text x="30" y="578" font-size="14" text-anchor="start" fill="black" >After N cycles: quotient = dividend / divisor, remainder = dividend % divisor (100 / 7 = 14 remainder 2).</text>
</svg>
