<svg width="120" height="100" viewBox="0 0 100 100"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Marker außerhalb des Symbols (robuster) -->
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="black"/>
    </marker>
  </defs>

  <symbol id="npn">
    <g transform="translate(0 15.5)">
      <g id="npn_classic">
        <polyline points="73,20 80,15 80,05" style="stroke:black;stroke-width:1;fill:none;"/>
        <!-- Basis -->
        <line x1="58" y1="25" x2="73" y2="25" style="stroke:black;stroke-width:1;fill:none;stroke-linecap:round"/>
        <line x1="73" y1="18" x2="73" y2="31" style="stroke:black;stroke-width:1;fill:none;"/>
        <!-- Emitter -->
        <polyline points="73,28 80,35 80,42" style="stroke:black;stroke-width:1;fill:none;"/>
        <!-- Pfeil -->
        <line x1="77" y1="34" x2="80" y2="37" style="stroke:black;stroke-width:1;marker-end:url(#arrowhead)"/>
        <!-- Kreis -->
        <circle cx="76" cy="25" r="11" style="stroke:black;stroke-width:1;fill:none;"/>
      </g>
    </g>
  </symbol>
    <symbol id="capacitor" viewBox="0 0 200 60">
        <!-- Leitungen -->
        <line x1="10" y1="30" x2="80" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <line x1="90" y1="30" x2="190" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <!-- capacitor -->
        <line x1="80" y1="10" x2="80" y2="49" stroke="black" stroke-width="4"/>
        <line x1="87" y1="10" x2="87" y2="49" stroke="black" stroke-width="4"/>
    </symbol>
  <!-- IEC (EU) Rechteck -->
  <symbol id="resistor" viewBox="0 0 200 60">
    <!-- Leitungen -->
    <line x1="10" y1="30" x2="60"  y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="30" x2="190" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <!-- Widerstandskörper -->
    <rect x="60" y="20" width="60" height="20" fill="none" stroke="currentColor" stroke-width="4"/>
  </symbol>
    <!-- LED -->
  <symbol id="led" viewBox="0 0 200 60">
          <!-- diode -->
    <polyline points="55,20 60,29 66,20" fill="black" stroke="black" stroke-width="1.0"/>
    <line x1="56" y1="30" x2="64" y2="30" style="stroke:black;"/>

    <!-- emission arrows -->
    <line x1="68" y1="18" x2="74" y2="12" stroke="black" stroke-width="1"/>
    <polyline points="72,18 74,12 68,14" fill="none" stroke="black" stroke-width="1"/>

    <line x1="68" y1="26" x2="74" y2="20" stroke="black" stroke-width="1"/>
    <polyline points="72,26 74,20 68,22" fill="none" stroke="black" stroke-width="1"/>

  </symbol>

        <circle cx="0" cy="50" r="9" style="stroke:black;fill:none;"/>
    <line x1="0" y1="11" x2="0" y2="91" style="stroke:black;" stroke-linecap="round"/>
    <circle cx="20" cy="43" r="1" style="stroke:black;stroke-width:1;fill:none;"/>
    <circle cx="92" cy="43" r="1" style="stroke:black;stroke-width:1;fill:none;"/>
  <!-- 1) Original: Höhe y=30 -->
  <use href="#npn" x="12" y="25"/>
  <!-- 2) Horizontal gespiegelt, gleiche Höhe y=30 -->
  <!-- translate(100,0) scale(-1,1) spiegelt an der Zeichenfläche (Breite=100) -->
  <g transform="translate(100,0) scale(-1,1)">
    <use href="#npn" x="0" y="25"/>
  </g>
      <!-- Widerstand gedreht (Rotation um (0,0), danach in die Fläche geschoben) -->
  <g transform="translate(98,9) rotate(90)">
    <use href="#resistor" width="40" height="12" color="currentColor"/>
  </g>
    <!-- Widerstand gedreht (Rotation um (0,0), danach in die Fläche geschoben) -->
  <g transform="translate(26,9) rotate(90)">
    <use href="#resistor" width="40" height="12" color="currentColor"/>
  </g>
    <g transform="translate(18,37)">
    <use href="#capacitor" width="40" height="12"/>
  </g>
    <!-- Widerstand gedreht (Rotation um (0,0), danach in die Fläche geschoben) -->
  <g transform="translate(60,37)">
    <use href="#capacitor" width="34" height="12"/>
  </g>
    <line x1="0" y1="11" x2="92" y2="11" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="0" y1="91" x2="92" y2="91" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/>
<line x1="56" y1="43" x2="70" y2="65.5" stroke="currentColor" stroke-width="0.7" />
<circle cx="42" cy="65.5" r="1" style="stroke:black;stroke-width:1;fill:none;"/>
<circle cx="70" cy="65.5" r="1" style="stroke:black;stroke-width:1;fill:none;"/>
     <line x1="42" y1="65.5" x2="42" y2="45" stroke="currentColor" stroke-width="0.7" />
    <line x1="70" y1="65.5" x2="70" y2="45" stroke="currentColor" stroke-width="0.7" />

          <!-- Widerstand gedreht (Rotation um (0,0), danach in die Fläche geschoben) -->
  <g transform="translate(48,9) rotate(90)">
    <use href="#resistor" width="40" height="12" color="currentColor"/>
  </g>
    <!-- Widerstand gedreht (Rotation um (0,0), danach in die Fläche geschoben) -->

    <!-- Widerstand gedreht (Rotation um (0,0), danach in die Fläche geschoben) -->
  <g transform="translate(76,9) rotate(90)">
    <use href="#resistor" width="40" height="12" color="currentColor"/>
  </g>
<!-- LED mittig unterhalb der beiden Transistoren -->
<g transform="translate(-10,67) scale(2,2)">
  <use href="#led" width="50" height="20"/>
</g>
<!-- LED mittig unterhalb der beiden Transistoren -->
<g transform="translate(62,67) scale(2,2)">
  <use href="#led" width="50" height="20"/>
</g>
    <line x1="42" y1="65.5" x2="62" y2="43" stroke="currentColor" stroke-width="0.7" />

     <line x1="20" y1="82" x2="20" y2="91" stroke="currentColor" stroke-width="0.8" />
     <line x1="92" y1="82" x2="92" y2="91.5" stroke="currentColor" stroke-width="0.8" />

    <text x="45" y="35" font-size="5">R_B2</text>
    <text x="73" y="35" font-size="5">R_B1</text>

    <text x="28" y="35" font-size="5">R_C2</text>
    <text x="63" y="35" font-size="5">R_C1</text>

</svg>
