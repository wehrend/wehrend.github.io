<svg width="660" height="270" viewBox="0 0 220 90" xmlns="http://www.w3.org/2000/svg" version="1.1">
    <defs>
        <marker id="arrow" markerWidth="5" markerHeight="8" refX="2.5" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L3,3z" fill="black" />
        </marker>
    </defs>
    <style>
        line, polyline { fill:none; stroke:black; stroke-width:0.5px; }
        text { font-family: sans-serif; }
    </style>

    <!-- testbench frame -->
    <rect x="4" y="6" width="212" height="70" rx="2" style="fill:none;stroke:black;stroke-width:0.5px;stroke-dasharray:2,1.5;"/>
    <text x="7" y="12" font-size="4">Testbench (no inputs, no outputs)</text>

    <!-- stimulus -->
    <rect x="12" y="28" width="40" height="24" style="fill:lightgreen;stroke:black;stroke-width:0.5px;"/>
    <text x="32" y="39" font-size="4" text-anchor="middle">Stimulus</text>
    <text x="32" y="44" font-size="3" text-anchor="middle">(input values)</text>

    <!-- DUT -->
    <rect x="80" y="28" width="40" height="24" style="fill:lightskyblue;stroke:black;stroke-width:0.5px;"/>
    <text x="100" y="39" font-size="4" text-anchor="middle">DUT</text>
    <text x="100" y="44" font-size="3" text-anchor="middle">(device under test)</text>

    <!-- checker -->
    <rect x="150" y="28" width="56" height="24" style="fill:lightgreen;stroke:black;stroke-width:0.5px;"/>
    <text x="178" y="39" font-size="4" text-anchor="middle">Checker</text>
    <text x="178" y="44" font-size="3" text-anchor="middle">compare with expected values</text>

    <!-- reference model -->
    <rect x="80" y="58" width="40" height="13" style="fill:white;stroke:black;stroke-width:0.5px;"/>
    <text x="100" y="66" font-size="3.5" text-anchor="middle">Reference model</text>

    <!-- arrows -->
    <line x1="52" y1="40" x2="78" y2="40" marker-end="url(#arrow)"/>
    <text x="54" y="38" font-size="3">inputs</text>
    <line x1="120" y1="40" x2="148" y2="40" marker-end="url(#arrow)"/>
    <text x="122" y="38" font-size="3">outputs</text>
    <circle cx="66" cy="40" r="0.8" fill="black"/>
    <polyline points="66,40 66,64.5 78,64.5" marker-end="url(#arrow)"/>
    <polyline points="120,64.5 178,64.5 178,54" marker-end="url(#arrow)"/>
    <text x="124" y="62.5" font-size="3">expected values</text>

    <!-- outputs of the simulation -->
    <polyline points="100,28 100,20 100,18" marker-end="url(#arrow)"/>
    <text x="100" y="15" font-size="3.5" text-anchor="middle">waveform (VCD)</text>
    <polyline points="178,52 178,52"/>
    <line x1="206" y1="40" x2="214" y2="40"/>
    <polyline points="214,40 214,84 196,84" style="stroke-dasharray:none;" marker-end="url(#arrow)"/>
    <text x="194" y="85" font-size="3.5" text-anchor="end">console: PASSED / FAILED</text>
</svg>
