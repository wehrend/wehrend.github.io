<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- pipeline diagram: four instructions, each shifted by one stage -->
  <g stroke="#A0AEC0" stroke-width="2" stroke-linejoin="round">
    <rect x="2"  y="6"  width="10" height="10" rx="1" />
    <rect x="14" y="6"  width="10" height="10" rx="1" />
    <rect x="26" y="6"  width="10" height="10" rx="1" />
    <rect x="14" y="20" width="10" height="10" rx="1" />
    <rect x="26" y="20" width="10" height="10" rx="1" />
    <rect x="38" y="20" width="10" height="10" rx="1" />
    <rect x="26" y="34" width="10" height="10" rx="1" />
    <rect x="38" y="34" width="10" height="10" rx="1" />
    <rect x="50" y="34" width="10" height="10" rx="1" />
  </g>
  <g fill="#A0AEC0">
    <rect x="26" y="6"  width="10" height="10" rx="1" opacity="0.5" />
    <rect x="26" y="20" width="10" height="10" rx="1" opacity="0.5" />
    <rect x="26" y="34" width="10" height="10" rx="1" opacity="0.5" />
  </g>
  <!-- time axis -->
  <g stroke="#A0AEC0" stroke-width="2" stroke-linecap="round">
    <line x1="2" y1="54" x2="58" y2="54" />
    <polyline points="54,50 59,54 54,58" />
  </g>
</svg>
