<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Interrupt (IRQ → ISR) Icon" role="img">

  <!-- IRQ Leitung -->
  <path d="M4 32 H18" stroke="#18c5c5" stroke-width="3" stroke-linecap="round"></path>

  <!-- IRQ Knoten -->
  <circle cx="18" cy="32" r="3.5" fill="#18c5c5" stroke="#0f8f8f" stroke-width="1.5"></circle>

  <!-- CPU -->
  <rect x="22" y="20" width="20" height="20" rx="3.5" fill="#1f2937" stroke="#0b1220" stroke-width="2"></rect>

  <!-- CPU Pins -->
  <path d="M18 24h4M18 30h4M18 36h4" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"></path>
  <path d="M42 24h4M42 30h4M42 36h4" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"></path>

  <!-- Blitz (Interrupt) -->
  <path d="M20 8 L14 24 H22 L18 40 L30 20 H22 Z" fill="#fbbf24" stroke="#f97316" stroke-width="2" stroke-linejoin="round"></path>

  <!-- Jump zur ISR -->
  <path d="M32 40 V50" stroke="#22c55e" stroke-width="3" stroke-linecap="round"></path>
  <path d="M32 50 L26.5 44.5" stroke="#22c55e" stroke-width="3" stroke-linecap="round"></path>
  <path d="M32 50 L37.5 44.5" stroke="#22c55e" stroke-width="3" stroke-linecap="round"></path>

  <!-- ISR Box -->
  <rect x="18" y="50" width="28" height="10" rx="3" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"></rect>

  <!-- ISR Text -->
  <text x="32" y="57" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="7.5" font-weight="700" fill="#ffffff">ISR</text>

</svg>