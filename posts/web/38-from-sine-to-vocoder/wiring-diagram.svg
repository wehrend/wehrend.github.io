<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="100%" height="100%" style="background-color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .title { font-size: 20px; font-weight: bold; fill: #1f2328; text-anchor: middle; }
  .subtitle { font-size: 12px; fill: #656d76; text-anchor: middle; }
  .comp-label { font-size: 14px; font-weight: bold; fill: #1f2328; text-anchor: middle; }
  .pin-label { font-size: 11px; font-family: 'SFMono-Regular', Consolas, monospace; fill: #1f2328; }
  .note { font-size: 10px; fill: #57606a; }
  .wire { stroke: #57606a; stroke-width: 1.5; fill: none; }
  .pin-dot { fill: #1f2328; }
</style>

<text x="480" y="28" class="title">Pico + PCM5102A + MAX4466 - Verdrahtung</text>
<text x="480" y="46" class="subtitle">Talkbox-Envelope-Follower-Projekt (siehe DEVLOG)</text>

<!-- ===== Pico ===== -->
<rect x="40" y="90" width="200" height="440" rx="16" fill="#e6f5ec" stroke="#1a7f37" stroke-width="1.5"/>
<text x="140" y="115" class="comp-label">Raspberry Pi Pico</text>

<circle cx="240" cy="150" r="4" class="pin-dot"/>
<text x="228" y="154" class="pin-label" text-anchor="end">GP16</text>
<circle cx="240" cy="190" r="4" class="pin-dot"/>
<text x="228" y="194" class="pin-label" text-anchor="end">GP17</text>
<circle cx="240" cy="230" r="4" class="pin-dot"/>
<text x="228" y="234" class="pin-label" text-anchor="end">GP18</text>

<circle cx="240" cy="300" r="4" class="pin-dot"/>
<text x="228" y="304" class="pin-label" text-anchor="end">GP26</text>
<circle cx="240" cy="340" r="4" class="pin-dot"/>
<text x="228" y="344" class="pin-label" text-anchor="end">GP27</text>

<circle cx="240" cy="410" r="4" class="pin-dot"/>
<text x="228" y="414" class="pin-label" text-anchor="end">3V3(OUT)</text>
<circle cx="240" cy="460" r="4" class="pin-dot"/>
<text x="228" y="464" class="pin-label" text-anchor="end">GND</text>

<!-- GP26 -> Poti (extern, nicht Teil dieses Diagramms) -->
<path class="wire" d="M244 300 L300 300" stroke-dasharray="3,3"/>
<circle cx="300" cy="300" r="3" fill="none" stroke="#57606a" stroke-width="1.5"/>
<text x="308" y="304" class="note">zum Poti (extern)</text>

<!-- ===== PCM5102A ===== -->
<rect x="650" y="90" width="230" height="290" rx="16" fill="#fef3e6" stroke="#bc4c00" stroke-width="1.5"/>
<text x="765" y="115" class="comp-label">PCM5102A (I2S-DAC)</text>

<circle cx="650" cy="150" r="4" class="pin-dot"/>
<text x="662" y="154" class="pin-label">BCK</text>
<circle cx="650" cy="190" r="4" class="pin-dot"/>
<text x="662" y="194" class="pin-label">LRCK</text>
<circle cx="650" cy="230" r="4" class="pin-dot"/>
<text x="662" y="234" class="pin-label">DIN</text>
<circle cx="650" cy="290" r="4" class="pin-dot"/>
<text x="662" y="294" class="pin-label">VIN</text>
<circle cx="650" cy="330" r="4" class="pin-dot"/>
<text x="662" y="334" class="pin-label">GND</text>

<rect x="665" y="345" width="200" height="70" rx="6" fill="none" stroke="#bc4c00" stroke-width="0.5" stroke-dasharray="3,3"/>
<text x="675" y="360" class="note">Jumper (fest, nicht Pico):</text>
<text x="675" y="373" class="note">XSMT=HIGH  FMT=I2S(LOW)</text>
<text x="675" y="386" class="note">DEMP=LOW  FLT=LOW  SCK=LOW</text>
<text x="675" y="399" class="note">-&gt; sonst dauerhaft stumm</text>

<!-- I2S wires, gleiche y wie Pico GP16/17/18 -->
<path class="wire" d="M244 150 L650 150"/>
<path class="wire" d="M244 190 L650 190"/>
<path class="wire" d="M244 230 L650 230"/>

<!-- ===== MAX4466 ===== -->
<rect x="650" y="440" width="230" height="170" rx="16" fill="#fbe9ee" stroke="#993556" stroke-width="1.5"/>
<text x="765" y="465" class="comp-label">MAX4466 (Mic-Amp)</text>

<circle cx="650" cy="500" r="4" class="pin-dot"/>
<text x="662" y="504" class="pin-label">VCC</text>
<circle cx="650" cy="540" r="4" class="pin-dot"/>
<text x="662" y="544" class="pin-label">GND</text>
<circle cx="650" cy="580" r="4" class="pin-dot"/>
<text x="662" y="584" class="pin-label">OUT</text>

<!-- ===== Spannungsteiler + Tiefpass (Signalaufbereitung) ===== -->
<rect x="360" y="545" width="220" height="90" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="4,3"/>
<text x="470" y="568" class="note" text-anchor="middle" font-weight="bold">Spannungsteiler (2x 2kOhm, /2)</text>
<text x="470" y="583" class="note" text-anchor="middle">+ 1nF gegen GND</text>
<text x="470" y="598" class="note" text-anchor="middle">(Tiefpass gg. I2S-Uebersprechen,</text>
<text x="470" y="611" class="note" text-anchor="middle">siehe DEVLOG)</text>

<!-- MAX4466 OUT -> Teiler -->
<path class="wire" d="M654 580 L580 580"/>
<!-- Teiler -> Pico GP27 -->
<path class="wire" d="M360 580 L300 580 L300 340 L244 340"/>
<!-- Teiler lokaler GND-Stub -->
<path class="wire" d="M420 635 L420 660"/>
<line x1="405" y1="660" x2="435" y2="660" stroke="#57606a" stroke-width="1.5"/>
<line x1="411" y1="666" x2="429" y2="666" stroke="#57606a" stroke-width="1.5"/>
<line x1="417" y1="672" x2="423" y2="672" stroke="#57606a" stroke-width="1.5"/>

<!-- ===== Versorgung: 3V3 verzweigt zu PCM VIN + MAX VCC ===== -->
<circle cx="300" cy="410" r="3" fill="#1f2328"/>
<path class="wire" d="M244 410 L300 410"/>
<path class="wire" d="M300 410 L300 290 L650 290"/>
<path class="wire" d="M300 410 L300 500 L650 500"/>

<!-- ===== Masse: GND verzweigt zu PCM GND + MAX GND + Teiler-GND ===== -->
<circle cx="330" cy="460" r="3" fill="#1f2328"/>
<path class="wire" d="M244 460 L330 460"/>
<path class="wire" d="M330 460 L330 330 L650 330"/>
<path class="wire" d="M330 460 L330 540 L650 540"/>
<path class="wire" d="M330 460 L330 660 L405 660"/>

<!-- ===== Legende ===== -->
<g transform="translate(60,700)">
  <rect x="0" y="0" width="840" height="70" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="16" y="20" class="note" font-weight="bold">LEGENDE:</text>
  <rect x="16" y="30" width="14" height="14" rx="2" fill="#e6f5ec" stroke="#1a7f37"/>
  <text x="36" y="41" class="note">Pico</text>
  <rect x="90" y="30" width="14" height="14" rx="2" fill="#fef3e6" stroke="#bc4c00"/>
  <text x="110" y="41" class="note">PCM5102A (Audio-Ausgang)</text>
  <rect x="290" y="30" width="14" height="14" rx="2" fill="#fbe9ee" stroke="#993556"/>
  <text x="310" y="41" class="note">MAX4466 (Mic-Vorverstaerker)</text>
  <rect x="510" y="30" width="14" height="14" rx="2" fill="#f1efe8" stroke="#5f5e5a" stroke-dasharray="2,2"/>
  <text x="530" y="41" class="note">Passive Signalaufbereitung</text>
  <text x="16" y="58" class="note">Punkt = Verzweigung (3V3/GND werden zu mehreren Zielen gefuehrt)</text>
</g>
</svg>
