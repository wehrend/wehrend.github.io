[params]
  date_format = "2006-01-02"
  # (Optional, default light) Sets color theme: light, dark or auto.
  # Theme 'auto' switches between dark and light modes based on browser/os preferences
  BookTheme = 'light'

  # (Optional, default true) Controls table of contents visibility on right side of pages.
  # Start and end levels can be controlled with markup.tableOfContents setting.
  # You can also specify this parameter per page in front matter.
  BookToC = true

  BookSection = "pages"


[markup]
  [markup.asciidocExt]
    workingFolderCurrent = true
    [markup.asciidocExt.attributes]
      toc = "left"
      toclevels = "2"
      source-highlighter = "rouge"
      source-linenums-option = ""
      rouge-css = "style"
      rouge-style = "github"

[security]
  enableInlineShortcodes = false
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', '^asciidoctor$']
    osEnv = ['(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$']

[markup.asciidocext]
    extensions = ["asciidoctor"]
    workingFolderCurrent = true
    trace = true
    verbose = true

[languages.en.markup]
  [languages.en.markup.goldmark]
    [languages.en.markup.goldmark.renderer]
      unsafe = true

[languages.de.markup]
  [languages.de.markup.goldmark]
    [languages.de.markup.goldmark.renderer]
      unsafe = true

  [frontmatter.handlers]
    adoc = "yaml"

[outputs]
  home = ["HTML", "RSS", "SITEMAP", "sitemaphtml"]

[outputFormats]
  [outputFormats.sitemaphtml]
    name = "sitemaphtml"
    mediaType = "text/html"
    baseName = "/sitemap"
    isPlainText = false
    notAlternative = true
    permalinkable = true
