<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="150" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <defs>
    <marker id="arrowhead" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto">
      <polygon points="0 0, 5 2.5, 0 5" style="fill:black;" />
    </marker>
  </defs>

  <rect x="10" y="30" width="120" height="90" style="fill:#ADD8E6; stroke:black; stroke-width:1;" />
  <text x="70" y="20" text-anchor="middle" style="font: 12px sans-serif;">N-type</text>
  <text x="70" y="135" text-anchor="middle" style="font: 12px sans-serif;">electrons (majority)</text>

  <circle cx="30" cy="50" r="2" style="fill:blue;" />
  <circle cx="60" cy="40" r="2" style="fill:blue;" />
  <circle cx="90" cy="60" r="2" style="fill:blue;" />
  <circle cx="45" cy="80" r="2" style="fill:blue;" />
  <circle cx="110" cy="70" r="2" style="fill:blue;" />
  <circle cx="75" cy="100" r="2" style="fill:blue;" />
  <circle cx="20" cy="110" r="2" style="fill:blue;" />
  <circle cx="100" cy="90" r="2" style="fill:blue;" />

  <rect x="170" y="30" width="120" height="90" style="fill:#FFB6C1; stroke:black; stroke-width:1;" />
  <text x="230" y="20" text-anchor="middle" style="font: 12px sans-serif;">P-Type</text>
  <text x="230" y="135" text-anchor="middle" style="font: 12px sans-serif;">holes (majority)</text>

  <circle cx="190" cy="50" r="2" style="fill:red;" />
  <circle cx="220" cy="40" r="2" style="fill:red;" />
  <circle cx="250" cy="60" r="2" style="fill:red;" />
  <circle cx="205" cy="80" r="2" style="fill:red;" />
  <circle cx="270" cy="70" r="2" style="fill:red;" />
  <circle cx="235" cy="100" r="2" style="fill:red;" />
  <circle cx="180" cy="110" r="2" style="fill:red;" />
  <circle cx="260" cy="90" r="2" style="fill:red;" />

  <rect x="130" y="30" width="40" height="90" style="fill:#D3D3D3; opacity:0.5;" />
  <line x1="130" y1="30" x2="130" y2="120" style="stroke:grey; stroke-dasharray:2 2; stroke-width:0.5;" />
  <line x1="170" y1="30" x2="170" y2="120" style="stroke:grey; stroke-dasharray:2 2; stroke-width:0.5;" />
  <text x="150" y="20" text-anchor="middle" style="font: 12px sans-serif;">depletion zone</text>

  <path d="M120 60 L140 60" style="stroke:black; stroke-width:1; fill:none; marker-end:url(#arrowhead);" />
  <text x="125" y="55" style="font-size:8px;">e⁻</text>
  <path d="M180 90 L160 90" style="stroke:black; stroke-width:1; fill:none; marker-end:url(#arrowhead);" />
  <text x="165" y="85" style="font-size:8px;">h⁺</text>
</svg>