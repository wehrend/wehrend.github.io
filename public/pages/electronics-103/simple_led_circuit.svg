<svg width="75.00" height="70.00"
     viewBox="0.0 0.0 75.0 70.0"
     viewPort="0 0 75px 70px"
     version="1.1"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns="http://www.w3.org/2000/svg">
    <text x="18" y="25" font-size="10">+</text>
    <text x="18" y="50" font-size="10">-</text>
    <circle cx="15" cy="35" r="9" style="stroke:black;fill:white;"/>
    <line x1="15" y1="12" x2="15" y2="50" style="stroke:black;"/>
    <polyline points="15,31 15,10 60,10 60,40" style="stroke:black;fill:none;"/>
    <polyline points="60,56, 60,65, 15,65 15,49" style="stroke:black;fill:none;"/>

    <!-- diode -->
    <polyline points="55,20 60,29 66,20" fill="black" stroke="black" stroke-width="1.0"/>
    <line x1="56" y1="30" x2="64" y2="30" style="stroke:black;"/>

    <!-- emission arrows -->
    <line x1="68" y1="18" x2="74" y2="12" stroke="black" stroke-width="1"/>
    <polyline points="72,18 74,12 68,14" fill="none" stroke="black" stroke-width="1"/>

    <line x1="68" y1="26" x2="74" y2="20" stroke="black" stroke-width="1"/>
    <polyline points="72,26 74,20 68,22" fill="none" stroke="black" stroke-width="1"/>

    <!-- resistor -->
    <rect x="58" y="40" width="4" height="16" style="stroke:black;fill:none;"/>
    <text x="64" y="50" font-size="10">≈</text>
    <text x="68" y="50" font-size="3" font-family="arial">Heat</text>

</svg>
